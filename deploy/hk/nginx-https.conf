# fleet-dao 驾驶舱入口（香港），证书签下来之后用这份：80 只留证书续期的验证路径，其余跳 https。
# deploy/hk.sh 按 /etc/fleet-dao/hk.env 渲染后装到 /etc/nginx/sites-available/fleet-dao，别在机器上手改。
# 只加这一个站点：listen 参数和旧站点保持一致（不加 default_server、不开 http2——http2 是整个 443 端口共用的开关，
# 开了会连旧网关的握手一起改掉）。
server {
    listen 80;
    server_name @@SERVER_NAME@@;

    location ^~ /.well-known/acme-challenge/ {
        root @@ACME_ROOT@@;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name @@SERVER_NAME@@;

    ssl_certificate /etc/letsencrypt/live/@@SERVER_NAME@@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@@SERVER_NAME@@/privkey.pem;

    # 驾驶舱前端是静态文件，就在本机给
    root @@WEB_ROOT@@;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 只有下面两处经隧道转给法国的驾驶舱后端（packages/api 的 FLEET_COCKPIT_LISTEN）：/api、/auth、/github/webhook。
    # fleet 命令的接口 /agent 只在法国本机回环上，这里不转。转发的公共设置写在 server 这一层，两处 location 都继承。
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    # 实时推送（SSE）是长连接：不缓冲、读超时放长；后端也带了 X-Accel-Buffering: no
    proxy_buffering off;
    proxy_read_timeout 1h;

    location ~ ^/(api|auth)(/|$) {
        proxy_pass http://@@API_UPSTREAM@@;
    }

    # GitHub 事件：https://@@SERVER_NAME@@/github/webhook（单个事件最大 25MB）
    location = /github/webhook {
        client_max_body_size 25m;
        proxy_pass http://@@API_UPSTREAM@@;
    }
}
