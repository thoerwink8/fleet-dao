# fleet-dao 驾驶舱入口（香港），证书签下来之后用这份：80 只留证书续期的验证路径，其余跳 https。
# deploy/hk.sh 按 /etc/fleet-dao/hk.env 渲染后装到 /etc/nginx/sites-available/fleet-dao，别在机器上手改。
# 只加这一个站点：listen 参数和旧站点保持一致（不加 default_server、不开 http2——http2 是整个 443 端口共用的开关，
# 开了会连旧网关的握手一起改掉）。
# 整站不让搜索引擎收录：每个 server 都带 X-Robots-Tag（robots.txt 故意不禁抓，见下面那一段）。add_header 和
# proxy_set_header 一样，哪一层自己写了一条，上一层的就全部不继承——自己写了 add_header 的 location 都要把
# X-Robots-Tag 再写一遍（deploy/test/public-site.test.sh 会查）。

# 公网 /healthz 的限流计数（站点文件在 nginx 的 http 层里被引入，这一行在这里生效；名字带 fleet_dao，不和旧站点撞）
limit_req_zone $binary_remote_addr zone=fleet_dao_healthz:1m rate=30r/m;

# 经隧道转给法国驾驶舱后端的连接留着复用：香港到法国一趟往返约 0.2 秒，每个请求都新建连接就要多付这一趟
# （2026-09-26 实测：新建连接 0.40 秒，复用 0.20 秒）。复用要三样齐：这里的 keepalive、下面 server 那一层的
# proxy_http_version 1.1 和清空的 Connection 头。
# 改这里之前必须知道：keepalive_timeout 必须比法国后端的空闲超时短（packages/api/src/keep-alive.ts，6 分钟），空闲连接
# 由这边先关；反过来，后端刚关掉的连接这边还拿去发请求，POST 这类不能重发的就回 502（packages/api 的 keep-alive 测试核对两边）。
# 香港是 nginx 1.18：keepalive_time 这类 1.19.10 才有的指令用不了；keepalive_requests 在 1.18 默认只有 100，写明。
upstream fleet_dao_api {
    server @@API_UPSTREAM@@;
    keepalive 16;
    keepalive_timeout 5m;
    keepalive_requests 1000;
}

server {
    listen 80;
    server_name @@SERVER_NAME@@;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ^~ /.well-known/acme-challenge/ {
        root @@ACME_ROOT@@;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name @@SERVER_NAME@@;

    ssl_certificate /etc/letsencrypt/live/@@SERVER_NAME@@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@@SERVER_NAME@@/privkey.pem;

    # 驾驶舱前端是静态文件，就在本机给（法国 deploy/release.sh 发过来，目录归 root）
    root @@WEB_ROOT@@;
    index index.html;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # robots.txt 故意不禁抓：爬虫要抓得到页面才看得见 noindex，禁抓了反而可能只凭外链把网址收进结果
    # （https://developers.google.com/search/docs/crawling-indexing/block-indexing）。明写一份，免得回落成首页
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\n";
    }

    # 单页的外壳、健康页、版本标记不让浏览器凭猜缓存：发布后刷新一次就是新版（带哈希的 assets 照常缓存）
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    # 版本标记带完整提交号，拿去 GitHub 一搜就找得到仓：只给法国经隧道来的（发布脚本的健康检查就这么读），别处来的
    # 一律 404（不回 403，免得让人知道它在）。比的是真正连进来的那一端：同一个 nginx 上别的站点要是开了 real_ip，
    # $remote_addr 会被请求头改掉，$realip_remote_addr 不会
    location = /release.json {
        if ($realip_remote_addr != "@@TUNNEL_PEER@@") {
            return 404;
        }
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location ^~ /health/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ =404;
    }

    # 演示版（假数据、不连后端，法国 deploy/release.sh 发来）：深链接回落到它自己的首页，不回落到根上那一份；
    # 首页不让浏览器凭猜缓存（发布后刷新一次就是新版）。路径同法国 release.env 的 FLEET_DEMO_PATH。
    # 可见范围文件（scopes/，法国 fleet-demo-scopes 推来）查不到就是 404、不回落、不缓存：作废一条链接当场生效
    location = @@DEMO_BASE@@ {
        return 301 @@DEMO_PATH@@$is_args$args;
    }
    location = @@DEMO_PATH@@ {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files @@DEMO_PATH@@index.html =404;
    }
    location = @@DEMO_PATH@@index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location ^~ @@DEMO_PATH@@ {
        try_files $uri @@DEMO_PATH@@index.html;
    }
    location ^~ @@DEMO_PATH@@scopes/ {
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # 只有下面这几处经隧道转给法国的驾驶舱后端（packages/api 的 FLEET_COCKPIT_LISTEN）：/api 与 /auth（实时推送 /api/events
    # 单列一段）、/github/webhook、/healthz，都走开头的 upstream fleet_dao_api（连接复用）。
    # fleet 命令的接口 /agent 只在法国本机回环上，这里不转。转发的公共设置写在 server 这一层，各处 location 都继承——
    # location 里只要写一条 proxy_set_header，这一层的就全部不继承了（清头那两条也跟着失效），所以 location 里别写。
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # 公网进来的请求清掉这两个头（设成空串 nginx 就不往后传）：它们是飞书网关的通行证和「代表哪位创始人」，
    # 外人拿公网请求来试就到不了后端。驾驶舱用 Cookie 登录用不到它们；飞书网关在香港本机直接走隧道调法国，不经这里。
    # 法国 france.sh 的读回从公网带着这两个头请求 /api，核对后端收到的请求里没有它们
    proxy_set_header Authorization "";
    proxy_set_header X-Fleet-Acting-Feishu "";
    proxy_connect_timeout 5s;
    # 实时推送（SSE）要边收边转：不缓冲；后端也带了 X-Accel-Buffering: no
    proxy_buffering off;
    # 普通请求 1 分钟没回音就回 504：连接是复用的，隧道断着时请求会发进一条没人应的旧连接，不设短了要干等 TCP 自己放弃（约 15 分钟）
    proxy_read_timeout 1m;

    # 实时推送（SSE）是长连接，读超时单放长（后端每 25 秒发一次心跳）
    location = /api/events {
        proxy_read_timeout 1h;
        proxy_pass http://fleet_dao_api;
    }

    location ~ ^/(api|auth)(/|$) {
        proxy_pass http://fleet_dao_api;
    }

    # GitHub 事件：https://@@SERVER_NAME@@/github/webhook（单个事件最大 25MB）。请求体和 X-Hub-Signature-256、
    # X-GitHub-Delivery、X-GitHub-Event 原样透传：法国对原始请求体验签，这里别加改请求体的指令（docs/ops.md 第九节）
    location = /github/webhook {
        client_max_body_size 25m;
        proxy_pass http://fleet_dao_api;
    }

    # 健康报告（后端逐项探库、Temporal……，全好 200、有一项不好 503），健康页 /health/ 读它。
    # 法国后端没起、隧道断了时这里回 502 / 504，健康页照实报红。公网谁都能打：每个来源每分钟 30 次、
    # 突发 10 次，超了回 429（健康页 15 秒刷一次，一个人开着远用不完），免得有人拿它把后端连库的探活打满
    location = /healthz {
        limit_req zone=fleet_dao_healthz burst=10 nodelay;
        limit_req_status 429;
        proxy_read_timeout 15s;
        proxy_pass http://fleet_dao_api;
    }
}
