# fleet-dao 驾驶舱入口（香港），证书还没签下来时用这份：只开 80。
# deploy/hk.sh 按 /etc/fleet-dao/hk.env 渲染后装到 /etc/nginx/sites-available/fleet-dao，别在机器上手改。
# 只加这一个站点：listen 参数和旧站点保持一致（不加 default_server、不开 http2），免得改到旧网关。
server {
    listen 80;
    server_name @@SERVER_NAME@@;

    location ^~ /.well-known/acme-challenge/ {
        root @@ACME_ROOT@@;
        default_type text/plain;
    }

    location / {
        root @@WEB_ROOT@@;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 演示版（假数据、不连后端，法国 deploy/release.sh 发来）：深链接回落到它自己的首页，不回落到根上那一份；
    # 首页不让浏览器凭猜缓存（发布后刷新一次就是新版）。路径同法国 release.env 的 FLEET_DEMO_PATH。
    # 可见范围文件（scopes/，法国 fleet-demo-scopes 推来）查不到就是 404、不回落、不缓存：作废一条链接当场生效
    location = @@DEMO_BASE@@ {
        return 301 @@DEMO_PATH@@$is_args$args;
    }
    location = @@DEMO_PATH@@ {
        root @@WEB_ROOT@@;
        add_header Cache-Control "no-cache" always;
        try_files @@DEMO_PATH@@index.html =404;
    }
    location = @@DEMO_PATH@@index.html {
        root @@WEB_ROOT@@;
        add_header Cache-Control "no-cache" always;
    }
    location ^~ @@DEMO_PATH@@ {
        root @@WEB_ROOT@@;
        try_files $uri @@DEMO_PATH@@index.html;
    }
    location ^~ @@DEMO_PATH@@scopes/ {
        root @@WEB_ROOT@@;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
}
