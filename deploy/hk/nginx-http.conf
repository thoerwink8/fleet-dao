# fleet-dao 驾驶舱入口（香港），证书还没签下来时用这份：只开 80。
# deploy/hk.sh 按 /etc/fleet-dao/hk.env 渲染后装到 /etc/nginx/sites-available/fleet-dao，别在机器上手改。
# 只加这一个站点：listen 参数和旧站点保持一致（不加 default_server、不开 http2），免得改到旧网关。
# 整站不让搜索引擎收录、release.json 只给隧道：同 nginx-https.conf 开头的说明（自己写了 add_header 的 location 要再写一遍 X-Robots-Tag）。

# 访问日志加上 $host，按站点分开统计。名字带 fleet_，免得和别家站点的 log_format 撞。
# 写在每个 server 里、路径仍是 /var/log/nginx/access.log：只换本站点的格式，轮转不动。
# 不要把 access_log 写在文件顶上——本文件在 http 层被引入，写顶上会记进别家站点。
# 末尾三段耗时（#3268）：同 nginx-https.conf。
log_format fleet_host '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" "$host" rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time';

server {
    listen 80;
    server_name @@SERVER_NAME@@;
    access_log /var/log/nginx/access.log fleet_host;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ^~ /.well-known/acme-challenge/ {
        root @@ACME_ROOT@@;
        default_type text/plain;
    }

    location / {
        root @@WEB_ROOT@@;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 新驾驶舱（#3818）：静态文件和 nginx-https.conf 同一套（/next/ 下找不到的回落到新外壳，不落到旧首页）。
    # 这份模板只开 80、一个 proxy_pass 都没有：/next/api/ 不转给法国（登录 Cookie 是 __Host- 前缀的 Secure Cookie，
    # 明文 80 上本来就带不上），回 404。upstream fleet2_cockpit 只在 nginx-https.conf 里。
    location = /next {
        return 301 /next/;
    }
    location ^~ /next/ {
        root @@WEB_ROOT@@;
        index index.html;
        try_files $uri $uri/ /next/index.html;
    }
    location ^~ /next/assets/ {
        root @@WEB_ROOT@@;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }
    location = /next/index.html {
        root @@WEB_ROOT@@;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location ^~ /next/api/ {
        return 404;
    }

    # 故意不禁抓（为什么：见 nginx-https.conf 同一段）
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\n";
    }

    # 香港本机探法国的状态（不在静态目录里，为什么见 nginx-https.conf 同一段）
    location = /health/france-link.json {
        alias /var/lib/fleet-hk-france-probe/status.json;
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # 版本标记只给法国经隧道来的，别处来的 404（为什么、为什么比 $realip_remote_addr：见 nginx-https.conf 同一段）
    location = /release.json {
        root @@WEB_ROOT@@;
        if ($realip_remote_addr != "@@TUNNEL_PEER@@") {
            return 404;
        }
    }

    # 已删的演示版（#1223，创始人 2026-10-07）：老链接、老书签一律 404，不回落到首页（回落了会回 200，发布脚本读回核对 404 就过不了）
    location ~ ^/demo(/|$) {
        return 404;
    }
}
