# deploy/lib/human-tier.sh 的 setup_session_ssh 渲染后放到 /etc/ssh/sshd_config.d/51-fleet-dao-session-user.conf（#1785），别在机器上手改。
# 为什么：会话用户（@@SESSION_USER@@）家里的 ~/.ssh 归它自己，#1773 的写码会话在里面自己生成钥匙、把自己的公钥写进自己的
# authorized_keys；有了这个口子，它还能 ssh localhost 登成自己，跳出 setpriv --no-new-privs 和 fleet-agents.slice。
# 做法：只对这一个用户，把认钥匙的文件指到 /etc/ssh/authorized_keys/%u（root:root 644，装机时照 pilot 家里的 authorized_keys 写），
# 它家里的 ~/.ssh 就不再有任何作用。不用「~/.ssh 改归 root」：家目录归会话用户，它能把整个 ~/.ssh 改名挪开再建一个自己的。
# Match 段放在 drop-in 里，到这份文件结束就止（OpenSSH 的 Include 读完会恢复 Match 之前的状态）；装完 readback_session_ssh_scope 用
# sshd -T -C 分别查会话用户和 pilot，确认只有会话用户被改。
Match User @@SESSION_USER@@
	AuthorizedKeysFile @@KEYS_DIR@@/%u
