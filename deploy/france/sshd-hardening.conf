# deploy/lib/human-tier.sh 的 setup_sshd_hardening 写的（装到 /etc/ssh/sshd_config.d/50-fleet-dao-hardening.conf），别在机器上手改，改这份再重跑 france.sh。
# 为什么：公网扫描器大量发起未认证连接，每条最长占一个未认证连接槽（LoginGraceTime 默认 120 秒）；槽超过 MaxStartups 的第一个数，
# sshd 就按比例随机丢新连接，正常的人和发版车连上来就报 "Connection timed out during banner exchange"（2026-10-08 法国真机查实：
# maxstartups 10:30:100、logingracetime 120，30 分钟里约 229 条 preauth/Failed）。
# 做法：未认证的等得短（20 秒）、槽放得宽（30 条才开始丢）；不改端口、不改认证方式（口令登录本来就是关的，这里不碰）。
# sshd 取每个选项第一次出现的值：这份排在 50-cloud-init.conf 之后，那几份没写这几项；装完 sshd -T 读回，被别处盖掉会判红。
#
# 没写 PerSourcePenalties：它是 OpenSSH 9.8 才有的选项，法国是 Ubuntu 24.04 自带的 9.6，认不得（sshd -t 会直接不过）。
# 升到 9.8 以上之后再加；在那之前，按来源 IP 封扫描器的事交给 fail2ban（deploy/france/fail2ban-sshd.jail）。
#
# MaxAuthTries 3 提醒：它数的是同一条连接上失败的认证次数，客户端的 agent 里钥匙多于 3 把、又没写 IdentitiesOnly 时，
# 还没轮到对的那把就会被断开（"Too many authentication failures"）。法国这边用 ssh 登录的（Mirasim、发版车）要用 -o IdentitiesOnly=yes 指定钥匙。

LoginGraceTime 20
MaxStartups 30:30:120
MaxAuthTries 3
