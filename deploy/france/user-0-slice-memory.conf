# root 的 ssh 会话（user-0.slice）的内存上限。deploy/france.sh 的 setup_user_slice_cap（自动档）装到
# /etc/systemd/system/user-0.slice.d/50-fleet-dao-memory.conf，别在机器上手改，改这份再跑 france.sh --auto-tier。
# 为什么：经 ssh 以 root 登上去的人或 AI，一条跑飞的命令（比如对几 G 长行 JSONL 的会话记录目录 grep -r）能吃光整机内存，
# 拖垮引擎、后端、Mirasim。它们各在自己的单元和 scope 里，不在这个 slice 里，所以只框住 ssh 会话，不影响它们。
# 超过 MemoryHigh 先被回收压慢，超过 MemoryMax 由内核杀掉这个 slice 里占内存最多的进程。
# 在 ssh 里手动跑重活（手动发版、pnpm install、tsc）要用 systemd-run --wait --pipe --collect 起到单元里，见 docs/ops.md。
[Slice]
MemoryHigh=2G
MemoryMax=3G
