packages:
  - "packages/*"
# 依赖的安装脚本默认不跑（pnpm 11 要求逐个表态）。esbuild（drizzle-kit、vite 带进来的）的脚本只做二进制自检，
# 平台二进制本来就经可选依赖装好，所以不放行。@swc/core（Temporal 打包工作流用）的只在缺平台原生包时兜底，
# pnpm 会装上平台包，不放行。protobufjs（飞书 SDK、Temporal 带进来的）的脚本只打印版本写法的提醒，不放行。
allowBuilds:
  esbuild: false
  '@swc/core': false
  protobufjs: false
# drizzle-kit（只在 db 的开发依赖里、只用来生成迁移）带的已弃用 @esbuild-kit/esm-loader 钉死 esbuild 0.18.20，
# 命中 GHSA-67mh-4wv8-2f99（esbuild <=0.24.2，开发服务器可被任意网页读取）。drizzle-kit 0.31.11 已是最新稳定版、
# 没有不带它的版本，所以只把这一条依赖路径指到 drizzle-kit 自己用的 esbuild 0.25.4。drizzle-kit 出了不再依赖
# @esbuild-kit/* 的稳定版就删这条。
overrides:
  '@esbuild-kit/core-utils>esbuild': 0.25.4
# 全局虚拟仓：本机多棵工作树共享一份 node_modules 链接，装第二棵起接近秒装。pnpm 检测到 CI 会自动关掉（官方文档）。
# 法国发版的构建沙箱是 env -i、不算 CI，开着会把依赖链到家目录、服务看不到：deploy/release.sh 的 RELEASE_PNPM_ENV 给构建沙箱里每条 pnpm 关掉它，
# CI 的 release_smoke（deploy/release-smoke.sh）照那组参数装一遍核对。v11.23.0 起 pnpm 自己派生的进程带 NODE_PATH 加 ESM 解析钩子，
# ESM 导入未声明的包不再失败；手动在 pnpm 之外起的 node 不带这个钩子（未声明依赖由 CI 的 deps 检查拦）。
enableGlobalVirtualStore: true
# 全局虚拟仓里包的真实路径在 .pnpm-store 下，往上找不到 @types/react，react-router 的类型里 React 变 any（NavLink 的 isActive 报隐式 any）。
# 把 @types/react 声明成它的可选对等依赖，pnpm 就把本工程那份链到它旁边。
# 同理 drizzle-kit 的 api.mjs（迁移测试 import 它）直接 import 'drizzle-orm'，却没声明；全局虚拟仓里它只看得见自己声明过的依赖，
# 在 pnpm 之外起的 node（npx vitest）会报找不到 drizzle-orm。声明成可选对等依赖，pnpm 就把本工程那份链到它旁边。
packageExtensions:
  drizzle-kit:
    peerDependencies:
      drizzle-orm: '*'
    peerDependenciesMeta:
      drizzle-orm:
        optional: true
  react-router:
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true
# 模块目录布局变了（例如升 pnpm 前建的工作树第一次遇上全局虚拟仓）时 pnpm 要清掉 node_modules 重装；默认先问人，
# 没有终端就直接报 ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY（报错信息里点名了这个键）。node_modules 随时能重装，不问。
confirmModulesPurge: false
