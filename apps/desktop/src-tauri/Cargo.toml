[package]
name = "fleet-desktop"
version = "0.1.0"
edition = "2021"
description = "Desktop shell: a Tauri 2 window around the kernel's web UI. No business code, no routes, no commands exposed to pages."
license = "Apache-2.0"
publish = false

# 自己是一个独立的 workspace：仓根的 cargo fmt/clippy/test（Windows 台）不连带编译 Tauri，
# 也不要求先把内核打包好（tauri-build 在构建时会核对 bundle.resources 里的文件都在）。
[workspace]

[lib]
name = "fleet_desktop_lib"
crate-type = ["rlib"]

[[bin]]
name = "fleet-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 只当客户端探 /health；外壳自己不监听任何端口
ureq = "2"

[target.'cfg(windows)'.dependencies]
jobrun = { path = "../../../crates/jobrun" }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
