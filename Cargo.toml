[workspace]
resolver = "2"
members = [
  "crates/jobrun",
  "crates/hostd",
  "crates/fleet-core",
  "crates/fleet-daemon",
  "crates/fleet-hostd",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
