# Google Antigravity（agy CLI）在规则模式下可用：agy 进程和 Google 系域名一律走「仅美国节点」手动选择组。
# 为什么：多数订阅里 google 相关域名落在香港或默认节点，Antigravity 会报地区不支持。
# 为什么手动选：Google 风控看出口 IP，测速组会来回换节点；在界面里固定一个 Google 见过的节点，mihomo 的 profile.store-selected 记住，重启后保持。
# 与订阅无关：不引用订阅里的组名和节点名，只靠节点名里的美国关键词挑节点（include-all-proxies + filter）。
# 订阅里一个美国节点都没有时：mihomo 不报错，空组会退化成直连（COMPATIBLE，即 DIRECT），所以 agy 会直连、
# 仍可能地区不支持；这时需要换有美国节点的订阅，或自己改下面的 filter。
# 语法：Clash Party 的 yaml 覆写里，数组键前加 + 是「插到订阅原有内容前面」（rules、proxy-groups 都支持）。
+proxy-groups:
  - name: Google 美国
    type: select
    include-all-proxies: true
    filter: "(?i)美国|美國|洛杉矶|洛杉磯|西雅图|西雅圖|硅谷|矽谷|圣何塞|聖何塞|纽约|紐約|芝加哥|达拉斯|達拉斯|凤凰城|鳳凰城|迈阿密|邁阿密|亚特兰大|United States|USA|(^|[^a-z])us([^a-z]|$)|🇺🇸"
+rules:
  - PROCESS-NAME,agy.exe,Google 美国
  - PROCESS-NAME,agy,Google 美国
  - DOMAIN-SUFFIX,google,Google 美国
  - DOMAIN-SUFFIX,goog,Google 美国
  - DOMAIN-SUFFIX,google.com,Google 美国
  - DOMAIN-SUFFIX,googleapis.com,Google 美国
  - DOMAIN-SUFFIX,gstatic.com,Google 美国
  - DOMAIN-SUFFIX,googleusercontent.com,Google 美国
  - DOMAIN,antigravity-cli-auto-updater-974169037036.us-central1.run.app,Google 美国
