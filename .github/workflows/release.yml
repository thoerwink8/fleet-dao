name: release
# 发布 vN 的收尾（#227 下半，决定 0011 第 4 条）：「发布 vN」PR 合进 main 之后，由这条工作流接手把
# tag 打好、release 建好、当前 milestone 关好、飞书推一条。可重试、幂等：哪一步已存在就跳那一步、接着走。
# 打 tag 之前先核这一版对得上版本里程碑（里程碑＝版本）：版本号贴错就在那一步红，tag、release 一样都不动（#593）。
# 收尾七步的编排在 packages/conventions/src/release-finalize.ts，每一步的判定在 publish-release-logic.ts（都有测试），
# 这里只认「这一版要不要发」、装依赖、调它。
# 不在这条链上做的：
#   - 不改仓、不提交（Unreleased 段在 PR 里就要写好）；
#   - 不排状态机状态文件（GitHub 上的 tag/release/里程碑/Release 正文末尾的飞书标记才是「事实」，每一步动手之前先查它在不在）。
# 触发（两种）：
#   1. pull_request closed：只放行 base=main、merged=true、head=release/v<N> 的（packages/conventions/src/publish.ts 的 classifyPullRequestClosed）。
#      分支对不上 → 这一步红、说清为什么不动作；「发布 PR 走了别的 base/分支」不可能只用「跳」盖过去，要人看见。
#      没合（merged=false）→ 不动作也不算红（这本来就是合法的「这张发布 PR 不发了」）。
#   2. workflow_dispatch：给一个 version 输入，照样走；多半是上次「发布 vN」PR 合并之后这条跑挂了，人手动补一轮。
#
# 国外停机状态下的「停机 → 等等 → 部署 → 恢复」四步（决定 0011 第 4 条）：这一条工作流**不做**这四步——法国那一侧自己
# 按版本标记拉（#618）：`deploy/france/auto-release` 每 5 分钟挑版本号最大的 `v<N>` tag（这里刚打的这个）指向的提交，
# 在签出目录里做「停派活 → 等在跑的收尾 → 部署 → 恢复派活」（复用已有的排空协议 `.drain-request`），引擎关着时那四步
# 照实写「跳过」。这条工作流只负责把标记打出来（tag → release → milestone → 飞书）；下面两个说明步骤保留，提醒读的人
# 四步在哪做、为什么不在这里做。
#
# 改这里之前必须知道：
# - 打 tag → 建 release → 关 milestone → 推飞书，顺序不能反（release-finalize.ts 里写死，测试钉着）。
# - 哪一步红了：日志里每步一行，七步的状态表在这次运行的摘要页（Summary）里。
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      version:
        description: '手动补一轮的版本号（比如 v42）；发布 PR 合并触发时不填'
        required: true
        type: string

permissions:
  contents: write # 打 tag、建 release、按本次发布的提交读 CHANGELOG.md
  issues: write # 关 milestone（milestone API 在 issues 权限下）
  pull-requests: read # workflow_dispatch 手动补跑时按 head=release/v<N> 查已合并 PR 的 merge_commit_sha（第二意见 2026-10-02）

# 同一版本并发跑两轮会都读到「未通知」、各推一条飞书（第二意见 2026-10-02）。
# 按版本分组：pull_request 触发用 head 分支名，dispatch 用手动输入的 version；同组只跑一轮，cancel-in-progress=false
# 让后来的等（不是挤掉）——「发布 vN 收尾」对都是会写仓的（tag、release、milestone、飞书），并发跑会互相覆盖。
concurrency:
  group: release-${{ github.event.pull_request.head.ref || inputs.version || 'unknown' }}
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # 分类要在 pnpm install 之前：普通 feat/… 合到 main 会触发这条 workflow，要先判成 noop、安安静静不动作（第二意见
      # 2026-10-02）。判成 noop 的场合不安装依赖就让后续 step 全 if proceed 跳掉——安装撞网/锁的时候也不会把「日常合并」
      # 这个无问题事件当红。classify 用的 packages/conventions/src/publish.ts 只用 Node 内置 API、不装依赖能直接跑。
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # a. 事件过滤：从 pull_request closed 触发时，只放行「合到 main、head 是 release/v<N>」；其余场合明说为什么不动作。
      # base/head 不 Bash 插值进 node 源码：分支名由仓库贡献者控制，单引号/反引号拼进 -e 的字符串就是远程代码执行。
      # 整段事件 JSON 走环境变量送过去，node 那边 JSON.parse（第二意见 2026-10-02）。
      - name: 认出这一版要不要发（pull_request closed）
        if: github.event_name == 'pull_request'
        id: classify
        env:
          EVENT: ${{ toJSON(github.event.pull_request) }}
        run: |
          set -euo pipefail
          out=$(EVENT_JSON="$EVENT" node --input-type=module -e "
            import { classifyPullRequestClosed } from './packages/conventions/src/publish.ts';
            const pr = JSON.parse(process.env.EVENT_JSON);
            const r = classifyPullRequestClosed({ merged: pr.merged === true, baseRef: pr.base.ref, headRef: pr.head.ref });
            console.log(JSON.stringify(r));
          ")
          kind=$(jq -r '.kind' <<<"$out")
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          if [[ $kind == proceed ]]; then
            version=$(jq -r '.version' <<<"$out")
            head_branch=$(jq -r '.headBranch' <<<"$out")
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "head_branch=$head_branch" >> "$GITHUB_OUTPUT"
          elif [[ $kind == noop ]]; then
            why=$(jq -r '.why' <<<"$out")
            echo "::notice::$why"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            msg=$(jq -r '.message' <<<"$out")
            echo "::error::$msg"
            exit 1
          fi

      # 手动补一轮：版本号从输入拿，不做分支过滤（发起人自己说要补哪一版）。
      - name: 手动补一轮：版本号从输入拿
        if: github.event_name == 'workflow_dispatch'
        id: dispatch
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! $VERSION =~ ^v[0-9]+$ ]]; then
            echo "::error::version 得是 v<N> 的模样：「$VERSION」"
            exit 1
          fi
          echo "kind=proceed" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "head_branch=release/$VERSION" >> "$GITHUB_OUTPUT"

      - name: 这一版要不要发的汇总
        id: invoke
        env:
          PR_KIND: ${{ steps.classify.outputs.kind }}
          PR_SKIP: ${{ steps.classify.outputs.skip }}
          PR_VERSION: ${{ steps.classify.outputs.version }}
          PR_HEAD: ${{ steps.classify.outputs.head_branch }}
          DS_VERSION: ${{ steps.dispatch.outputs.version }}
          DS_HEAD: ${{ steps.dispatch.outputs.head_branch }}
        run: |
          set -euo pipefail
          if [[ ${GITHUB_EVENT_NAME:-} == workflow_dispatch ]]; then
            echo "version=$DS_VERSION" >> "$GITHUB_OUTPUT"
            echo "head_branch=$DS_HEAD" >> "$GITHUB_OUTPUT"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif [[ $PR_KIND == proceed ]]; then
            echo "version=$PR_VERSION" >> "$GITHUB_OUTPUT"
            echo "head_branch=$PR_HEAD" >> "$GITHUB_OUTPUT"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif [[ $PR_SKIP == true ]]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::这一版要不要发认不出来（merged 和分支黑白没进 classify 的三态）"
            exit 1
          fi

      # 安装依赖挪到「确定要发」之后：noop / error 的场合不安装（第二意见 2026-10-02，普通 feat 合到 main 不该撞安装失败当红）。
      - uses: pnpm/action-setup@v4
        if: steps.invoke.outputs.proceed == 'true'
      - uses: actions/setup-node@v4
        if: steps.invoke.outputs.proceed == 'true'
        with:
          node-version: 22
          cache: pnpm
      - if: steps.invoke.outputs.proceed == 'true'
        run: pnpm install --frozen-lockfile

      # b. 停派遣：这条工作流**不做**——法国那一侧自己按版本标记排空（#618 的「停派活 → 等在跑的收尾 → 部署 → 恢复派活」，
      # 复用已有的排空协议 .drain-request，引擎关着时照实写「跳过」）。这里只说明在哪儿做，免得读的人以为漏了一步。
      - name: 停在法国的哪一侧做（说明）
        if: steps.invoke.outputs.proceed == 'true'
        env:
          VERSION: ${{ steps.invoke.outputs.version }}
        run: |
          echo "「停派活 → 等在跑的收尾 → 部署 → 恢复派活」四步由法国那一侧做：deploy/france/auto-release 每 5 分钟挑"
          echo "版本号最大的 v<N> tag（刚打的 $VERSION）指向的提交，写排空请求、等引擎手上收尾、发、撤请求（#618）。"
          echo "法国引擎当前 FLEET_SERVICES=fleet-api（deploy/france/desired-config.json），那四步照实写「跳过」，不假装做过。"

      # c–f. 收尾七步在一个 node 进程里按先后走（原先这里是两百行 Bash，#593 抠成可测的代码）：
      # 找本次发布合并的提交 → 按那个提交读 CHANGELOG.md 这一版（不读工作区：手动补跑时 main 早往前走了）→
      # 核版本里程碑（打 tag 之前，对不上 tag、Release 都不动）→ 打 tag（指着本次合并的提交）→ 建 Release（读回核对）→
      # 关里程碑（拿回包核）→ 推飞书（Release 正文末尾记 fleet-notified，补跑不重发）。
      # 每一步先查 GitHub 上的现状，做过的跳过；哪一步红了后面都不走，七步各自的状态写进这次运行的摘要。
      - name: 收尾：核里程碑 → 打 tag → 建 Release → 关里程碑 → 推飞书（每步状态见运行摘要）
        if: steps.invoke.outputs.proceed == 'true'
        env:
          VERSION: ${{ steps.invoke.outputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          PR_MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          RELEASE_MERGED_AT: ${{ github.event.pull_request.merged_at }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLEET_FEISHU: ${{ secrets.FLEET_FEISHU }}
        run: node packages/conventions/src/bin/release-finalize.ts

      # g. 恢复派活：同 b，由法国那一侧做（切完撤掉排空请求，引擎下一眼就接着派；引擎关着时照实写「跳过」）。
      - name: 恢复派活也由法国那一侧做（说明）
        if: steps.invoke.outputs.proceed == 'true'
        run: |
          echo "恢复派活同上：法国那一侧发布切完撤掉排空请求，引擎下一眼就接着派；引擎关着时照实写「跳过」（#618）。"
