name: release
# 发布 vN 的收尾（#227 下半，决定 0011 第 4 条）：「发布 vN」PR 合进 main 之后，由这条工作流接手把
# tag 打好、release 建好、当前 milestone 关好、飞书推一条。可重试、幂等：哪一步已存在就跳那一步、接着走。
# 不在这条链上做的：
#   - 不改仓、不提交（Unreleased 段在 PR 里就要写好）；
#   - 不排状态机状态文件（状态机 packages/conventions/src/release-notes.ts 是「法」判定，GitHub 上的 tag/release 才是「事实」；
#     每一步动手之前先查它在不在，在就照幂等跳）。
# 触发（两种）：
#   1. pull_request closed：只放行 base=main、merged=true、head=release/v<N> 的（packages/conventions/src/publish.ts 的 classifyPullRequestClosed）。
#      分支对不上 → 这一步红、说清为什么不动作；「发布 PR 走了别的 base/分支」不可能只用「跳」盖过去，要人看见。
#      没合（merged=false）→ 不动作也不算红（这本来就是合法的「这张发布 PR 不发了」）。
#   2. workflow_dispatch：给一个 version 输入，照样走；多半是上次「发布 vN」PR 合并之后这条跑挂了，人手动补一轮。
#
# 国外停机状态下的「停机 → 等等 → 部署 → 恢复」四步（决定 0011 第 4 条）：法国引擎当前 FLEET_SERVICES=fleet-api（不含 fleet-engine，
# 即停机在.deploy/france/desired-config.json），所以「停派遣」和「恢复派遣」这两步是说明性的空转，只把状态写进日志；
# #453 把法国发改成按版本+创始人拍之后，这里才真正接 deploy/france/。
#
# 改这里之前必须知道：
# - 每一小节 step 都做一件事、打一行日志；哪一步挂了从日志一眼看得到。
# - 打 tag → 建 release → 关 milestone → 推飞书，顺序不能反（release-notes.ts 的 nextState 也是这个顺序）。
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      version:
        description: '手动补一轮的版本号（比如 v42）；发布 PR 合并触发时不填'
        required: true
        type: string

permissions:
  contents: write # 打 tag、建 release
  issues: write # 关 milestone（milestone API 在 issues 权限下）

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # a. 事件过滤：从 pull_request closed 触发时，只放行「合到 main、head 是 release/v<N>」；其余场合明说为什么不动作。
      # base/head 不 Bash 插值进 node 源码：分支名由仓库贡献者控制，单引号/反引号拼进 -e 的字符串就是远程代码执行。
      # 整段事件 JSON 走环境变量送过去，node 那边 JSON.parse（第二意见 2026-10-02）。
      - name: 认出这一版要不要发（pull_request closed）
        if: github.event_name == 'pull_request'
        id: classify
        env:
          EVENT: ${{ toJSON(github.event.pull_request) }}
        run: |
          set -euo pipefail
          out=$(EVENT_JSON="$EVENT" node --input-type=module -e "
            import { classifyPullRequestClosed } from './packages/conventions/src/publish.ts';
            const pr = JSON.parse(process.env.EVENT_JSON);
            const r = classifyPullRequestClosed({ merged: pr.merged === true, baseRef: pr.base.ref, headRef: pr.head.ref });
            console.log(JSON.stringify(r));
          ")
          kind=$(jq -r '.kind' <<<"$out")
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          if [[ $kind == proceed ]]; then
            version=$(jq -r '.version' <<<"$out")
            head_branch=$(jq -r '.headBranch' <<<"$out")
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "head_branch=$head_branch" >> "$GITHUB_OUTPUT"
          elif [[ $kind == noop ]]; then
            why=$(jq -r '.why' <<<"$out")
            echo "::notice::$why"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            msg=$(jq -r '.message' <<<"$out")
            echo "::error::$msg"
            exit 1
          fi

      # 手动补一轮：版本号从输入拿，不做分支过滤（发起人自己说要补哪一版）。
      - name: 手动补一轮：版本号从输入拿
        if: github.event_name == 'workflow_dispatch'
        id: dispatch
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! $VERSION =~ ^v[0-9]+$ ]]; then
            echo "::error::version 得是 v<N> 的模样：「$VERSION」"
            exit 1
          fi
          echo "kind=proceed" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "head_branch=release/$VERSION" >> "$GITHUB_OUTPUT"

      - name: 这一版要不要发的汇总
        id: invoke
        env:
          PR_KIND: ${{ steps.classify.outputs.kind }}
          PR_SKIP: ${{ steps.classify.outputs.skip }}
          PR_VERSION: ${{ steps.classify.outputs.version }}
          PR_HEAD: ${{ steps.classify.outputs.head_branch }}
          DS_VERSION: ${{ steps.dispatch.outputs.version }}
          DS_HEAD: ${{ steps.dispatch.outputs.head_branch }}
        run: |
          set -euo pipefail
          if [[ ${GITHUB_EVENT_NAME:-} == workflow_dispatch ]]; then
            echo "version=$DS_VERSION" >> "$GITHUB_OUTPUT"
            echo "head_branch=$DS_HEAD" >> "$GITHUB_OUTPUT"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif [[ $PR_KIND == proceed ]]; then
            echo "version=$PR_VERSION" >> "$GITHUB_OUTPUT"
            echo "head_branch=$PR_HEAD" >> "$GITHUB_OUTPUT"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif [[ $PR_SKIP == true ]]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::这一版要不要发认不出来（merged 和分支黑白没进 classify 的三态）"
            exit 1
          fi

      # b. 停派遣（说明性空转）：法国引擎当前 FLEET_SERVICES=fleet-api（不含 fleet-engine），派遣已经停着；
      # 等决定 0011 第 3/4 条把法国发改成「按版本+创始人拍」接了 release.yml 之后，这里才是真的动派遣。
      - name: 法国派遣已停（说明）
        if: steps.invoke.outputs.proceed == 'true'
        run: |
          echo "法国引擎当前 FLEET_SERVICES=fleet-api（deploy/france/desired-config.json），派遣已停；这里是空转。"
          echo "等 #453（本机验过再发）把「按版本+创始人拍」接到这条工作流上，这一步才真动。"

      # c. 打 tag：已存在就跳；不存在就打、推。
      - name: 打 tag（已存在就跳）
        if: steps.invoke.outputs.proceed == 'true'
        env:
          VERSION: ${{ steps.invoke.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::notice::tag $VERSION 已经在，跳打 tag（幂等）。"
            exit 0
          fi
          if gh api "repos/${{ github.repository }}/git/ref/tags/$VERSION" >/dev/null 2>&1; then
            echo "::notice::远端 tag $VERSION 已经在，跳打 tag（幂等）。"
            exit 0
          fi
          # 拉下远端 tag 列表：fetch-depth: 0 带了提交图，但 tag 引用未必都在 refs/tags 下
          git fetch origin "+refs/tags/*:refs/tags/*" || true
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::notice::tag $VERSION 已经在，跳打 tag（幂等）。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "$VERSION"
          git push origin "$VERSION"
          echo "tag $VERSION 已打。"

      # d. 建 GitHub release：已存在且正文一致跳；正文不一致更新；不存在就建。
      - name: 建 GitHub release（幂等：不存在就建、正文不一致就改回）
        if: steps.invoke.outputs.proceed == 'true'
        env:
          VERSION: ${{ steps.invoke.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 从仓根 CHANGELOG.md 拿「## [$VERSION] - 日期」那一段的原文当正文（发起人已经把它从 Unreleased 收进标题）。
          # 逻辑在 packages/conventions/src/publish-release-logic.ts（extractReleaseBody）：找不到标题、正文空、
          # 或正文只剩占位符（只剩「还没有」）都明确失败——不拿 Unreleased 段顶替（那里多是占位，照抄就发了假 release，第二意见 2026-10-02）。
          VERSION_ENV="$VERSION" node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            import { extractReleaseBody } from './packages/conventions/src/publish-release-logic.ts';
            const r = extractReleaseBody(readFileSync('CHANGELOG.md', 'utf8'), process.env.VERSION_ENV);
            if (r.kind !== 'ok') {
              console.error(\`::error::\${r.message}\`);
              process.exit(1);
            }
            console.log(r.body);
          " > /tmp/release-body.md
          # 已存在：读回比正文。比对时把 fleet-notified 标记剥掉——飞书那一步打在末尾的标签不能当「被人手改了正文」，
          # 不然重跑这一轮会先把正文改回去、飞书那步接着判「没标过」再发一遍（第二意见 2026-10-02）。
          version=$(echo "$VERSION")
          if existing=$(gh release view "$VERSION" --json body,tagName 2>/dev/null); then
            existing_body=$(jq -r '.body' <<<"$existing")
            # 剥掉 <!-- fleet-notified: vN --> 那一行再比。
            existing_changelog_part=$(grep -vE '^<!-- fleet-notified: [^ ]+ -->$' <<<"$existing_body" | sed -e 's/[[:space:]]*$//')
            want=$(cat /tmp/release-body.md | sed -e 's/[[:space:]]*$//')
            if [[ $existing_changelog_part == "$want" ]]; then
              echo "::notice::release $VERSION 已经在，正文一致（幂等跳，fleet-notified 标记保留）。"
              exit 0
            fi
            echo "::notice::release $VERSION 正文被人手改过（不一致，剥掉 fleet-notified 标记后还是对不上 CHANGELOG.md），改回原文并记一笔。"
            # 把剥掉的 fleet-notified 行贴回去，别把上次发飞书的证据一起抹了。
            notified_marks=$(grep -E '^<!-- fleet-notified: [^ ]+ -->$' <<<"$existing_body" || true)
            {
              printf '%s' "$want"
              if [[ -n $notified_marks ]]; then printf '\n\n%s\n' "$notified_marks"; fi
            } > /tmp/release-body-rewrite.md
            gh release edit "$VERSION" --notes-file /tmp/release-body-rewrite.md
            exit 0
          fi
          gh release create "$VERSION" --title "$VERSION" --notes-file /tmp/release-body.md
          echo "release $VERSION 已建。"

      # e. 关 milestone：读回开放 milestone 里叫 v<N> 的那一张，关它。没开着的那一张不算错（可能已经关过了）。
      - name: 关 milestone（开放里恰好叫这一版的那一张；对不上 / 撞号都明说）
        if: steps.invoke.outputs.proceed == 'true'
        env:
          VERSION: ${{ steps.invoke.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 开放 milestone 一页一页全翻完（per_page=100 × N，gh api --paginate 顺 link rel=next 翻到最后一页），
          # 只拿一页的话 100+ 张时会漏目标、误报「已关」（第二意见 2026-10-02）。
          # 挑哪一张的判定在 packages/conventions/src/publish-release-logic.ts 的 pickOpenMilestone：
          # ^v<N>([^0-9]|$) 词边界（v1 不撞 v10），撞多张 → error、发起人先看一眼，不拿「第一张」糊弄。
          MILESTONES_JSON=$(gh api --paginate "repos/${{ github.repository }}/milestones?state=open&per_page=100" | jq -s 'add')
          export MILESTONES_JSON VERSION_ENV="$VERSION"
          num=$(node --input-type=module -e "
            import { pickOpenMilestone } from './packages/conventions/src/publish-release-logic.ts';
            const list = JSON.parse(process.env.MILESTONES_JSON).map((m) => ({ number: m.number, title: m.title }));
            const r = pickOpenMilestone(list, process.env.VERSION_ENV);
            if (r.kind === 'found') { console.log(r.milestone.number); process.exit(0); }
            if (r.kind === 'none') { console.error(\`::notice::\${r.why}\`); process.exit(0); }
            console.error(\`::error::\${r.message}\`);
            for (const m of r.candidates) console.error(\`  #\${m.number}  \${m.title}\`);
            process.exit(2);
          ")
          if [[ -z $num ]]; then
            echo "开放 milestone 里没找到 $VERSION 开头的那一张（可能已关或还没建），跳过。"
            exit 0
          fi
          title=$(jq -r --argjson n "$num" '.[] | select(.number == $n).title' <<<"$MILESTONES_JSON")
          gh api -X PATCH "repos/${{ github.repository }}/milestones/$num" -F state=closed >/dev/null
          echo "milestone #$num（$title）已关。"

      # f. 飞书：配了 webhook 就发一条、Release 正文末尾打「<!-- fleet-notified: vN -->」标签记下；配了但没发过一次以上，
      #     按「不在就不再发」幂等（第二意见 2026-10-02：手动重跑、超时要重试都不能让飞书重复收一条）。
      - name: 飞书推一条（已发过就跳；FLEET_FEISHU 没配就明说、不算错）
        if: steps.invoke.outputs.proceed == 'true'
        env:
          VERSION: ${{ steps.invoke.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLEET_FEISHU: ${{ secrets.FLEET_FEISHU }}
        run: |
          set -euo pipefail
          if [[ -z ${FLEET_FEISHU:-} ]]; then
            echo "::notice::没配飞书（secret FLEET_FEISHU 不在），未通知。"
            exit 0
          fi
          # 幂等：这一版的 release 正文里已经写了 <!-- fleet-notified: vN --> → 上次发过，跳。
          # 读 release 读不出来不许|||| 兜成空正文：GitHub 临时故障时「查不到」被当「没发过」，会重复推飞书；
          # 读不出就明确失败、这一轮中止（第二意见 2026-10-02）。
          export VERSION_ENV="$VERSION"
          if ! existing=$(gh release view "$VERSION" --json body 2>&1); then
            echo "::error::gh release view $VERSION 失败：$existing"
            exit 1
          fi
          notified=$(jq -r '.body' <<<"$existing" | node --input-type=module -e "
            import { feishuAlreadyNotified } from './packages/conventions/src/publish-release-logic.ts';
            let body = '';
            process.stdin.on('data', (c) => (body += c));
            process.stdin.on('end', () => {
              console.log(feishuAlreadyNotified(body, process.env.VERSION_ENV) ? '1' : '0');
            });
          ")
          if [[ $notified == 1 ]]; then
            echo "::notice::release 正文里已有 <!-- fleet-notified: $VERSION -->：上次已经发过，跳（幂等）。"
            exit 0
          fi
          body=$(cat /tmp/release-body.md)
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md"
          msg="$VERSION 上线了。

$body

— $url"
          jq -n --arg text "$msg" '{msg_type:"text", content:{text:$text}}' | \
            curl -fsS -X POST -H 'content-type: application/json' --data-binary @- "$FLEET_FEISHU" >/dev/null
          # 发成功了打标签：下次重跑撞见标签就跳，不重复发
          jq -r '.body' <<<"$existing" | node --input-type=module -e "
            import { appendFeishuNotifiedMark } from './packages/conventions/src/publish-release-logic.ts';
            let body = '';
            process.stdin.on('data', (c) => (body += c));
            process.stdin.on('end', () => {
              console.log(appendFeishuNotifiedMark(body, process.env.VERSION_ENV));
            });
          " > /tmp/release-body-with-mark.md
          gh release edit "$VERSION" --notes-file /tmp/release-body-with-mark.md >/dev/null
          echo "飞书已推一条（release 正文末尾已打 fleet-notified 标签）。"

      # g. 恢复派遣（说明性空转：引擎当前就不开派遣）。
      - name: 法国派遣恢复（说明）
        if: steps.invoke.outputs.proceed == 'true'
        run: |
          echo "法国派遣本来就不开（FLEET_SERVICES=fleet-api）；这里同样是空转。"
          echo "等 #453 把法国发按版本+创始人拍接上，这一步才真动。"
