name: merge-gate
# 合并闸（#74）：在 PR 当前头上写提交状态 merge-gate，「按我们的规矩能不能合」只看它一个——不是草稿、和主线没冲突、
# 改到先审后合的路径（packages/conventions/high-risk-paths.json）时当前头上有通过的 second-opinion；必填栏只提醒
# （packages/conventions/src/merge-gate.ts，design 第五节「流程只为快」）。
# 挂了单的 PR 还要当前头上有引擎机器人贴的、通过的「认领对得上」（#348，这张单归开这个 PR 的人）。
# 三处触发：
# - PR 事件用 pull_request_target：有冲突的 PR 上 pull_request 跑不起来，fork 来的 PR 在 pull_request 里也拿不到写状态的令牌。
#   这里跑的是主线上的代码、检出的是主线，不检出也不跑 PR 里的代码；PR 的 plan.md、specs 目录都按 API 现读。
# - 主线推送：冲突是主线一变才出现的，逐个重算所有开着的 PR。
# - status 事件：第二意见写上 second-opinion、引擎贴上「认领对得上」时逐个重算所有开着的 PR（引擎用 App 令牌贴，会触发 status 事件）。
#   不按事件里的 sha 只算那一个：下面的排队组只留最新一个，一轮对账贴好几个 PR 时中间的运行被取消，只算最后那个的话前面的就停在旧结论上。
# 用 GITHUB_TOKEN 写的状态不会再触发 status 事件，不会自己转圈。也能在 Actions 页手动跑（填 PR 号，留空算所有开着的）。
on:
  pull_request_target:
    types:
      [
        opened,
        reopened,
        synchronize,
        edited,
        ready_for_review,
        converted_to_draft,
        labeled,
        unlabeled,
        milestoned,
        demilestoned,
      ]
  push:
    branches: [main]
  status:
  workflow_dispatch:
    inputs:
      pr:
        description: PR 号；留空算所有开着的
        required: false
# PR 事件按 PR 排、新的顶掉旧的；主线推送、第二意见状态、手动运行共用一个组排队（不中途打断，只留最新一个等着），
# 旧的不会在新的之后写回。另外写回前还会核一遍主线头没变（merge-gate.ts），变了就不写，交给新一轮。
concurrency:
  group: merge-gate-${{ github.event_name == 'pull_request_target' && github.event.pull_request.number || 'all' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}
permissions:
  contents: read
  pull-requests: read
  statuses: write
jobs:
  merge-gate:
    if: github.event_name != 'status' || github.event.context == 'second-opinion' || github.event.context == '认领对得上'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 默认检出触发分支（pull_request_target 也是主线），高风险清单和判法都用主线上的：PR 改不了自己的门槛
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 退出码 2 = 有 PR 没算成或没写上状态（没写上的那个 PR 缺 merge-gate，合不了），同样是红
      - run: node packages/conventions/src/bin/merge-gate.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
