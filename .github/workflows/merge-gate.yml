name: merge-gate
# 合并闸（#74；#444 起只留四样；#555-2 起加一条冷调用；#654 起草稿、冲突交给 GitHub 自己拦；#1114 / 决定 0023 起去掉先审后合；
# 决定 0093 起判改标准；决定 0106 起加判安全基前置要你拍）: 在 PR 当前头上写提交状态 merge-gate，「按我们的规矩能不能合」只看它一个——
# 碰了改标准路径（packages/conventions/standard-paths.json 的 paths）的 PR 正文里要有创始人原话那一行；
# 碰了安全基路径（同一份清单的顶层 security-base）的 PR 当前头上要有 success 的 security-base-approved（「前置要你拍」拍下来贴上的，
# 决定 0106；SHA 换了旧 SHA 上的不算）；引擎任务 PR 当前头上有通过的 cold-verify（#555，合前一次冷调用）；别的只看 CI。
# 判法在 packages/conventions/src/merge-gate.ts，design 第五节「流程只为快」「人闸第四类：改标准」。
# 闸读 PR 改了哪些文件和正文（只认创始人原话那一行），不看标签、里程碑。
# 三处触发（#654 起主线推送只在「闸认的东西」变了才触发：冲突不判了，别的主线推送什么都没变）：
# - PR 事件用 pull_request_target：fork 来的 PR 在 pull_request 里拿不到写状态的令牌。
#   这里跑的是主线上的代码、检出的是主线，不检出也不跑 PR 里的代码；PR 的分支名按 API 现读。
# - status 事件：验收那一遍写上 cold-verify、或「要你拍」批下 security-base-approved 时逐个重算所有开着的 PR。
#   不按事件里的 sha 只算那一个：下面的排队组只留最新一个，一轮对账贴好几个 PR 时中间的运行被取消，只算最后那个的话前面的就停在旧结论上。
# - 主线推送且只动了闸认的东西（判法、改标准的路径清单、这份工作流）：已经开着的 PR 上旧的 merge-gate 状态是按旧判法算的，
#   判法收紧了，旧的 success 不会自己变——所以把开着的 PR 全重算一遍（第二意见 #656 第 2 轮）。
#   paths 要盖住判法 import 到的每一个文件，packages/conventions/test/merge-gate-inputs.test.ts 钉着：以后给闸多引一个文件却忘了列在这里会红。
# 用 GITHUB_TOKEN 写的状态不会再触发 status 事件，不会自己转圈。也能在 Actions 页手动跑（填 PR 号，留空算所有开着的）。
# 可复用（#2749，design 15.7 第 9 条「CI 用可复用工作流，引用 fleet-dao 里的那份」）：别的仓用 workflow_call 引它，
# 触发、权限由引用方写（pnpm project add 开的补齐 PR 里那份）。要算的仓一律取 github.repository（被引用时就是引用方的仓）；
# 判法的代码从 standard-repo 检出（引用方填判法所在的仓，本仓自己跑时留空＝本仓），所以这里不写死哪个仓。
on:
  workflow_call:
    inputs:
      standard-repo:
        description: 判法所在的仓（owner/名字）；留空＝就是本仓
        type: string
        required: false
        default: ''
      standard-ref:
        description: 判法检出哪个分支；留空＝那个仓的默认分支
        type: string
        required: false
        default: ''
  pull_request_target:
    # 头变了（opened、reopened、synchronize）、正文改了（edited：改标准的 PR 补上创始人原话要重算，不然闸一直红）时重算；
    # 草稿、冲突、标签、里程碑不是输入（#654），它们变了触发的运行多半被下面的排队组顶掉（70 次里 43 次），白占一个检查位。
    # edited 也包括改标题、改目标分支，多算一次无妨（同一个 PR 新的顶掉旧的）
    types: [opened, reopened, synchronize, edited]
  status:
  push:
    branches: [main]
    paths:
      - .github/workflows/merge-gate.yml
      - packages/conventions/src/bin/merge-gate.ts
      - packages/conventions/src/closing-issues.ts
      - packages/conventions/src/flow-branch.ts
      - packages/conventions/src/gh-api.ts
      - packages/conventions/src/merge-gate.ts
      - packages/conventions/src/merge-gates.ts
      - packages/conventions/src/pr-columns.ts
      - packages/conventions/src/standard-paths-file.ts
      - packages/conventions/src/standard-paths.ts
      - packages/conventions/standard-paths.json
  workflow_dispatch:
    inputs:
      pr:
        description: PR 号；留空算所有开着的
        required: false
# PR 事件按 PR 排、新的顶掉旧的；冷验收状态、手动运行共用一个组排队（不中途打断，只留最新一个等着），
# 旧的不会在新的之后写回。
concurrency:
  group: merge-gate-${{ github.event_name == 'pull_request_target' && github.event.pull_request.number || 'all' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}
permissions:
  contents: read
  pull-requests: read
  statuses: write
jobs:
  merge-gate:
    if: github.event_name != 'status' || github.event.context == 'cold-verify' || github.event.context == 'security-base-approved'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 默认检出触发分支（pull_request_target 也是主线），判法和改标准的路径清单都用主线上的：PR 改不了自己的门槛。
      # 被别的仓引用时检出判法所在的仓（standard-repo），不检出引用方的代码
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.standard-repo || github.repository }}
          ref: ${{ inputs.standard-ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 退出码 2 = 有 PR 没算成或没写上状态（没写上的那个 PR 缺 merge-gate，合不了），同样是红
      - run: node packages/conventions/src/bin/merge-gate.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
