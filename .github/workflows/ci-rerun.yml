name: ci-rerun
# 主线 ci 红了先自动重跑一次失败的 job（#2747）：近 7 天主线 ci 红 40 轮里 12 轮（143 分钟）是偶发，同一个提交重跑就过；
# 原来没人重跑，要等下一个提交或人来点，这段时间挡着发版和后面所有人。
# 防死循环：只认 ci 的主线 push 那一轮、只在第一次运行（run_attempt=1）失败时重跑一次——重跑那次（run_attempt=2）再红就不管了，
# 照旧红着等人（真红不会被重跑盖住：重跑也红，结论还是 failure）。被取消的、PR、每夜、手动的都不重跑。
# 只用 GitHub 的运行记录、不检出代码、不跑任何仓里的代码；令牌只给 actions: write（重跑要它）。
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
permissions:
  actions: write
concurrency:
  group: ci-rerun-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  rerun:
    if: >-
      github.event.workflow_run.name == 'ci' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 重跑这一轮失败的 job（只这一次）
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          echo "主线 ci 第一次运行红了（$RUN_URL），重跑失败的 job 一次"
          gh run rerun "$RUN_ID" --failed -R "$GITHUB_REPOSITORY"
          echo "已重跑：$RUN_URL" >> "$GITHUB_STEP_SUMMARY"
