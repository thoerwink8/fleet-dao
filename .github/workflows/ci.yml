name: ci
# 按改动跑、并行跑（design 第五节「CI 按改动跑」）：changes 算出这次改了什么、哪几个 job 要跑（packages/conventions/src/ci-plan.ts），
# biome、tsc、apps 里各步、test、web、deploy 看它给的开关；check 汇总核对「该跑的跑了且绿、不该跑的确实跳过」。
# 主线推送跑「上一次主线真绿的头…这次的头」那段累计改动该跑的（基准查不到、认不出路径一律退回全跑）；
# 区间口径、取消前一轮的取舍见 docs/ci-speedup-plan.md 的 D。
#
# 改这里之前必须知道：
# - 必过检查（规则集「主线保护」）只认 check 这一个 job 名，别改名；它 needs 全部 job、if: always()，少 needs 一个就等于不拦那个。
# - 不用工作流级的 paths 过滤：必过检查要每个 PR 都触发，跳过的 job 由汇总核对（test/ci-plan.test.ts 核这份文件的结构）。
# - 加 job 要同时加进 ci-plan.ts 的 PLANNED_JOBS（或 ALWAYS_JOBS）和 check 的 needs。
# - job 数 = 一个 PR 占的并发槽数（GitHub 免费档同时最多 20 个）；几个小检查并进同一个 job，装依赖只装一次，
#   墙钟不变而槽数少几个——别为「各自干净」再把它们拆回两个 job（不够快）。
# - 并进 lint 的几步必须各自 continue-on-error、最后一步统一判红：GitHub 默认 step 失败就停，前一步红了后一步被跳过
#   = 类型错一路没人看见（#566 漏了 7 个 TS2532，就是 biome 先红把 tsc 跳过）。这条由 test/ci-plan.test.ts 钉着。
on:
  pull_request:
    # opened、synchronize、reopened（GitHub 默认这三个）：hygiene 不扫 PR 标题、正文了（只扫文件树和提交历史），
    # 改标题正文不用重跑（创始人 2026-09-28 傍晚拍，specs/169-Fusion形态/需求.md）。
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
# 令牌只给读代码：这里的检查都只看检出来的文件，不读 GitHub 上的现状（#87：必过检查必须确定）。
permissions:
  contents: read
# 并发组 PR 按号分、推主线按分支分，两边不撞：pull_request 事件的 github.ref 是 refs/pull/<N>/merge，push 到 main
# 是 refs/heads/main。按 PR 号分组更直接，也防着触发类型以后再加回 edited 之类——已经合了的 PR 被编辑触发一轮时，
# GitHub 给它的 github.ref 会是 refs/heads/main，按 github.ref 分组就会和主线那一轮撞上、把主线的全量挤掉（曾经出过
# 这个事：主线头上 check 红、自动发布不发，2026-09-27 #283）。
# 只有 PR 上新的一轮挤掉旧的；主线推送不挤掉在跑的那一轮：它跑完，新推送排着（同组只排一个，更新的顶掉更旧的）。
# 要是也挤，合并比主线全量（3–4 分钟）还密时每一轮都被下一次推送挤成 cancelled，一个全绿的提交都没有，
# 自动发布往回也找不到能发的（2026-09-27 夜最近 100 次主线 CI 被挤掉 26 次，#362）。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # 这次改了什么 → 各 job 的开关。PR 按 git diff origin/<目标分支>...HEAD 算（HEAD 是 GitHub 造的合并提交，比的就是合进去会带进来的改动）；
  # base 拿不到、diff 失败都判红（退出码 2），认不出的路径、读不出的依赖图升成全跑。
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 只有这一个 job 多要 actions: read（读主线运行记录找基准）；别的 job 仍只读代码。
    permissions:
      contents: read
      actions: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      biome: ${{ steps.plan.outputs.biome }}
      tsc: ${{ steps.plan.outputs.tsc }}
      tests: ${{ steps.plan.outputs.tests }}
      web: ${{ steps.plan.outputs.web }}
      deploy: ${{ steps.plan.outputs.deploy }}
      deploy_matrix: ${{ steps.plan.outputs.deploy_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 主线推送：查「上一次主线真绿的头」，这一轮只跑它到现在这段累计改动该跑的（读不到就空，下一步照旧全跑）。
      - id: mainbase
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: echo "sha=$(node packages/conventions/src/bin/main-base.ts ci.yml "$BRANCH")" >> "$GITHUB_OUTPUT"
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          MAIN_BASE: ${{ steps.mainbase.outputs.sha }}
        run: node packages/conventions/src/bin/ci-plan.ts --event "$EVENT" --base "origin/$BASE" --main-base "$MAIN_BASE"

  # 一堆「装一次依赖、跑一条命令」的小检查，全并进这一个 job（原来 biome、tsc、docs、hygiene 各占一台机器，
  # 各出 25 秒的 checkout + setup-node + pnpm install 固定开销，四台占掉四个并发槽）：一个 PR 的 CI 少占三个并发槽，
  # 能并着跑的 PR 就多。这几步各自最慢 20 秒上下，串起来仍短于最慢的测试台（db 约 87 秒），所以整轮墙钟不变。
  #
  # 每一步都 continue-on-error + 最后一步（汇总）判红，而不是靠默认的「前一步红了后一步就跳过」——那正是 #566
  # 漏检的来路（biome 先红，tsc 显示 skipped，整棵树的类型错一条都不报）。几步各跑各的、各报各的。
  # 汇总那一步还要核「该跑的真跑了且绿、不该跑的确实跳过」（开关来自 changes 的输出）：跳过的步不能当成跑过了。
  # 这一步的脚本由 test/ci-plan.test.ts 抠出来真跑，每种红法都造一遍。
  #
  # 这个 job 里各步的分工：
  # - biome：只改 .md 时不跑（biome 不认 md）；有非 md 改动才跑。
  # - tsc -b：跟着 biome 一起（tsc 也不看 md）；只查受影响的项目，全跑时查整棵树。
  # - docs：文档指针、skill 指针，每个 PR 都跑、不裁剪（改名挪文件也会让文档里的指针指空）。
  # - 卫生检查两步：每个 PR 都跑、不裁剪，但只报不挡（不算进汇总的判红，也不进 check 的必过名单）——真正挡的是
  #   推之前：pre-push 钩子、引擎推分支时的扫描（创始人 2026-09-28 傍晚拍，specs/169-Fusion形态/需求.md）。这里留着
  #   是为了早一步看到（汇总步会打一条 ::warning::）、也接住钩子没装或被跳过的情况。
  #   PR 检出到 pr/ 只当数据扫；执行的是目标分支（主线）上那份 packages/hygiene，检出到 trusted/——防的是这个 PR 自己
  #   改宽规则、白名单，当场就用上放过自己（#115 第二意见）。所以卫生检查两步排在 pnpm install 和一切跑 PR 代码的
  #   步骤**之前**：PR 的安装脚本、测试还没跑，改不到 trusted/。改卫生检查的规则、白名单要合进主线之后才用上——
  #   要加白名单的，先单独合一个只改白名单的 PR。除了扫 PR 最终的文件树，还按提交扫这个 PR 的历史（先加后删的、
  #   提交说明），只在 pull_request 事件上跑（push 到 main 没有 base/head 这两个概念）。
  lint:
    # 不等 changes：自己现算一遍同一份计划（ci-plan.ts，PR 按 git diff origin/<目标分支>...HEAD，三个点从合并基算，
    # 两边取 origin/main 的先后不影响结果；主线推送不给区间基准、按全跑查），和 changes 并行起，小 PR 少等一跳。
    # 几步各有各的开关，没法用一个 job 级 if 表达：job 一律开，里面每步自己看算出来的开关。
    # 所以纯文档 PR 也会起这一台，但它跑得很快（装依赖加 docs 两份测试），且省下了「四个 job 各起一台」的固定开销。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # PR 在 pr/、主线的卫生检查代码在 trusted/，并排放：biome check . 不会扫到 trusted/。
    defaults:
      run:
        working-directory: pr
    steps:
      # 按提交扫这个 PR 的历史要完整提交图：默认浅克隆只有 GitHub 造的这一个合并提交，base、head 两头都不在里面。
      - uses: actions/checkout@v4
        with:
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          sparse-checkout: packages/hygiene
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 和 packages/hygiene/src/bin/check.ts 做的一样，只是代码取 trusted/、扫的是 pr/。退出码 2 = 没扫全，同样是红
      - name: 卫生检查（主线上的代码，扫 PR 的文件）
        id: hygiene
        continue-on-error: true
        env:
          TRUSTED: ${{ github.workspace }}/trusted
        run: |
          node --input-type=module -e '
          import { pathToFileURL } from "node:url";
          const { runCheck } = await import(pathToFileURL(`${process.env.TRUSTED}/packages/hygiene/src/check.ts`).href);
          const { code, lines } = runCheck({ root: process.cwd(), mustInclude: "packages/hygiene/src/rules.ts" });
          for (const line of lines) (code === 0 ? console.log : console.error)(line);
          process.exitCode = code;
          '
      # 上面那步只看 PR 最终的文件树：先加后删的真密钥、提交说明里的真密钥推上去就公开了，那步看不见。这里按提交扫
      # base..head，和推送前的闸（packages/hygiene/src/prepush.ts）、引擎推分支同一份判定（historyArgs / scanHistory）。
      - name: 卫生检查（主线上的代码，按提交扫这个 PR 的历史）
        id: hygiene_history
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          TRUSTED: ${{ github.workspace }}/trusted
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          node "$TRUSTED/packages/hygiene/src/bin/ci-history.ts" --base "$BASE" --head "$HEAD"

      # ——从这里往下才跑 PR 里的代码（算计划、装依赖会跑 PR 的安装脚本）——
      # 算不成（base 拿不到、diff 失败）退出 2，这一步红、job 红，不静默少查。
      - name: 算这次要查什么（和 changes 同一份判法）
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: node packages/conventions/src/bin/ci-plan.ts --event "$EVENT" --base "origin/$BASE"

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: pr/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pr/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      # biome、tsc、docs 三样同时跑（各自后台进程、各写各的日志和退出码），一样红了不影响另外两样跑完、各自报告
      # （#566：连着写成串行 step、biome 先红就把 tsc 跳过，7 个类型错就是这么漏的）。
      # 结果写成这一步的输出 biome/tsc/docs = success | failure | skipped，由下一步「汇总」逐样核对；这一步自己中途
      # 崩了、输出没写全，汇总读到空值同样判红（空不等于 success，也不等于 skipped）。
      # tsc -b 只查受影响的项目（各自 tsconfig 的 include 里跨包导入的源码一起查）；全跑时查整棵树。
      # docs：文档指针、skill 指针，每个 PR 都跑、不裁剪。
      - name: biome、tsc、docs 并行跑
        id: checks
        env:
          BIOME_WANT: ${{ steps.plan.outputs.biome }}
          TSC: ${{ steps.plan.outputs.tsc }}
          LOGS: ${{ runner.temp }}/lint-checks
        run: |
          set -uo pipefail
          mkdir -p "$LOGS"
          start() {
            local name=$1
            shift
            ("$@" >"$LOGS/$name.log" 2>&1; echo $? >"$LOGS/$name.rc") &
          }
          run_tsc() {
            if [[ $TSC == all ]]; then pnpm exec tsc -b; else read -ra projects <<<"$TSC"; pnpm exec tsc -b "${projects[@]}"; fi
          }
          names=()
          if [ "$BIOME_WANT" = true ]; then start biome pnpm exec biome check .; names+=(biome); else echo "biome=skipped" >>"$GITHUB_OUTPUT"; fi
          if [ -n "$TSC" ]; then start tsc run_tsc; names+=(tsc); else echo "tsc=skipped" >>"$GITHUB_OUTPUT"; fi
          start docs pnpm exec vitest run packages/conventions/test/doc-pointers.test.ts agents/test/
          names+=(docs)
          wait
          for name in "${names[@]}"; do
            rc=$(cat "$LOGS/$name.rc" 2>/dev/null || echo missing)
            echo "::group::$name（退出码 $rc）"
            cat "$LOGS/$name.log" 2>/dev/null || echo "（没有日志）"
            echo "::endgroup::"
            if [ "$rc" = 0 ]; then echo "$name=success" >>"$GITHUB_OUTPUT"; else echo "::error::$name 没过（退出码 $rc）"; echo "$name=failure" >>"$GITHUB_OUTPUT"; fi
          done

      # 汇总：该跑的必须 success、不该跑的必须 skipped，哪一样不对 job 就红、连名字一起报。
      # 卫生检查两步只报不挡：红了只打一条 ::warning::，不让 job 红。
      - name: 汇总（biome / tsc / docs 有一步不对这里就红）
        if: always()
        env:
          BIOME: ${{ steps.checks.outputs.biome }}
          TSC: ${{ steps.checks.outputs.tsc }}
          DOCS: ${{ steps.checks.outputs.docs }}
          BIOME_WANT: ${{ steps.plan.outputs.biome }}
          TSC_WANT: ${{ steps.plan.outputs.tsc }}
          HYGIENE: ${{ steps.hygiene.outcome }}
          HYGIENE_HISTORY: ${{ steps.hygiene_history.outcome }}
        run: |
          set -euo pipefail
          bad=''
          # 参数：名字、这一步的 outcome、本该跑吗（yes/no）
          verify() {
            if [ "$3" = yes ]; then
              [ "$2" = success ] || bad="$bad $1（$2，本该 success）"
            else
              [ "$2" = skipped ] || bad="$bad $1（$2，本该 skipped）"
            fi
          }
          biome_want=no; if [ "$BIOME_WANT" = true ]; then biome_want=yes; fi
          tsc_want=no; if [ -n "$TSC_WANT" ]; then tsc_want=yes; fi
          verify biome "$BIOME" "$biome_want"
          verify tsc "$TSC" "$tsc_want"
          verify docs "$DOCS" yes
          if [ "$HYGIENE" = failure ] || [ "$HYGIENE_HISTORY" = failure ]; then
            echo "::warning::卫生检查没过（只报不挡，看上面那两步的日志）"
          fi
          if [ -n "$bad" ]; then
            echo "::error::lint 里有检查不对：$bad"
            exit 1
          fi
          echo "lint 里该跑的几步都过了、不该跑的都跳过了：biome=$BIOME tsc=$TSC docs=$DOCS"

  # 测试分几台、每台跑哪些文件：ci-plan.ts（选单元）→ test-split.ts（按耗时装箱，一台一份明确的文件清单），
  # job 名就是那一台的名字（「2/5 · pg」）。不再用 vitest --shard 按文件个数切（#654 那版：engine 三台 89/35/137 秒、
  # rest 三台 87/72/125 秒，极不均）。只跑受影响的包（改到的 + 依赖它们的）。
  # 环境按这一台装进的文件算，不看包：
  # - 要真 Postgres 的（packages/db 下的测试，matrix.pg）才起 postgres:16 容器，测试经 FLEET_TEST_PG_URL 连上
  #   （和法国生产同大版本，ops.md 第二节）：第一次跑迁移建模板库、之后每个测试文件 CREATE DATABASE … TEMPLATE 克隆
  #   一份（#220）。容器在 job 一开始就后台 docker run -d 起（pull 放到后台、装依赖之后再等，不和装依赖串着等），
  #   pg_isready 通了才跑测试。
  # - 要 Temporal 命令行的（github-reconcile.test.ts 用真开发服务端，matrix.temporal）才装它，版本和校验和从
  #   deploy/france.sh 读、缓存按版本 + 校验和；测试里 CI 没给这个变量就直接红（test/support.ts）。
  # 每台跑完都要核对「实际跑的测试文件 == 分到的这一台」（ci-box.ts verify，用 vitest 的 JSON 报告）：vitest 的位置
  # 参数是子串过滤，交给它清单也不等于它正好跑这些；多跑、少跑都红，没跑成不许当通过。
  # PR 上的结果缓存（packages/conventions/src/ci-cache.ts）：同一个 PR 重推，这一台的输入（分到的文件、源码、依赖、
  # 根配置、环境……）没变、上一轮又全绿，就不再跑 vitest。缓存按 ref 分作用域，PR 的缓存只有这个 PR 自己读得到；
  # 主线（push）这一轮是自动发布的闸门，一个测试都不许跳：下面缓存的每一步都只在 pull_request 上跑，入口脚本也自己认事件名。
  # job 照常 success，跳的只是 vitest 那一步；缓存读不到、清单对不上、算不出，一律回来真跑。
  test:
    needs: changes
    if: needs.changes.outputs.tests != '[]'
    name: test (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # FLEET_TEST_PG_URL 只给 pg 台（装上来的文件要真库的那一台）：从模板库克隆各自的测试库（#220）。放在 job 上是为了
    # 算缓存键的那一步也看得到（有没有真 Postgres 是键的一部分）。
    env:
      FLEET_TEST_PG_URL: ${{ matrix.pg && 'postgres://fleet_test:fleet_test@localhost:5432/fleet_test_admin' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.tests) }}
    steps:
      # postgres:16 只给 pg 台用，所以不用 services（services 每台都起、起一次约 12 秒，别的台白等），
      # 改成这一台自己 docker run。整条 docker run（含拉镜像）放后台跑，这一步当场结束；装依赖之后再等它起来：
      # 原来单独等的那 14 秒和装依赖叠在一起，不串着等。后台进程活到 job 结束（Actions 在 job 末尾才清孤儿进程）。
      - name: 起 postgres:16（只 pg 台，后台）
        if: matrix.pg
        run: |
          set -euo pipefail
          nohup docker run -d --name fleet-test-pg -p 5432:5432 \
            -e POSTGRES_USER=fleet_test -e POSTGRES_PASSWORD=fleet_test -e POSTGRES_DB=fleet_test_admin \
            postgres:16-alpine > "$RUNNER_TEMP/fleet-test-pg-start.log" 2>&1 &
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 等 postgres:16 起来（只 pg 台）
        if: matrix.pg
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            if docker exec fleet-test-pg pg_isready -U fleet_test -d fleet_test_admin >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/fleet-test-pg-start.log" >&2 || true
          docker logs fleet-test-pg >&2 || true
          echo "postgres:16 起了 90 秒还没好（后台 docker run 的输出在上面）" >&2
          exit 1
      # 引擎有几条测试要真的 Temporal 开发服务端（测试服务端和真服务端行为不同的地方）：用和法国同一版的命令行起，
      # 版本和校验和从 deploy/france.sh 读（只有一份），缓存按版本 + 校验和。测试里 CI 没给这个变量就直接红（test/support.ts）。
      - name: Temporal 命令行的版本（和法国同版）
        if: matrix.temporal
        id: temporal
        run: |
          set -euo pipefail
          version=$(sed -n 's/^TEMPORAL_CLI_VERSION=//p' deploy/france.sh)
          sha=$(sed -n 's/^TEMPORAL_CLI_SHA256=//p' deploy/france.sh)
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || ! $sha =~ ^[0-9a-f]{64}$ ]]; then
            echo "deploy/france.sh 里没读到 Temporal 命令行的版本或校验和（version=$version sha=$sha）" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: matrix.temporal
        id: temporal-cache
        with:
          path: ~/.cache/fleet-temporal-cli/${{ steps.temporal.outputs.version }}
          key: temporal-cli-${{ runner.os }}-${{ steps.temporal.outputs.version }}-${{ steps.temporal.outputs.sha }}
      - name: 下载 Temporal 命令行（缓存没命中时；校验和对不上就红）
        if: matrix.temporal && steps.temporal-cache.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.temporal.outputs.version }}
          SHA: ${{ steps.temporal.outputs.sha }}
        run: |
          set -euo pipefail
          dir="$HOME/.cache/fleet-temporal-cli/$VERSION"
          mkdir -p "$dir"
          tgz="$RUNNER_TEMP/temporal-cli.tgz"
          curl -fsSL --retry 3 -o "$tgz" \
            "https://github.com/temporalio/cli/releases/download/v$VERSION/temporal_cli_${VERSION}_linux_amd64.tar.gz"
          echo "$SHA  $tgz" | sha256sum -c -
          tar -xzf "$tgz" -C "$dir" temporal
      - name: 核对版本，交给测试
        if: matrix.temporal
        env:
          VERSION: ${{ steps.temporal.outputs.version }}
        run: |
          set -euo pipefail
          cli="$HOME/.cache/fleet-temporal-cli/$VERSION/temporal"
          "$cli" --version
          "$cli" --version | grep -qF "$VERSION"
          echo "FLEET_TEST_TEMPORAL_CLI=$cli" >> "$GITHUB_ENV"
      # 这一台分到哪些测试文件：矩阵里那一份 JSON 过 ci-box.ts 核一遍（名字、文件清单、两个开关），
      # 一行一个写到 BOX_FILE，后面的步骤都按数组展开交给 vitest，不拼进命令行。
      - name: 这一台跑哪些文件
        id: box
        env:
          MATRIX: ${{ toJSON(matrix) }}
        run: |
          set -euo pipefail
          box_file="$RUNNER_TEMP/fleet-test-box-files.txt"
          mkdir -p "$RUNNER_TEMP/fleet-test-out"
          node packages/conventions/src/bin/ci-box.ts files --box "$MATRIX" --out "$box_file"
          echo "box_file=$box_file" >> "$GITHUB_OUTPUT"
      # —— PR 上的测试结果缓存（只 pull_request；说明见 test job 上面的注释）。
      # 1. 算键（这一台分到的文件、它们的哈希、源码闭包、环境身份）；算不出 enabled=false，后面几步都跳过、测试全跑
      - name: 测试缓存：算键
        if: github.event_name == 'pull_request'
        id: cache-key
        env:
          BOX_FILE: ${{ steps.box.outputs.box_file }}
          LABEL: ${{ matrix.label }}
          TEMPORAL: ${{ matrix.temporal && format('{0} {1}', steps.temporal.outputs.version, steps.temporal.outputs.sha) || '' }}
        run: node packages/conventions/src/bin/ci-cache.ts key --event "$GITHUB_EVENT_NAME" --tmp "$RUNNER_TEMP" --box-file "$BOX_FILE" --label "$LABEL" --temporal "$TEMPORAL"
      # 2. 取上一轮存的清单（键完全一样才命中，不用 restore-keys）
      - name: 测试缓存：取清单
        if: github.event_name == 'pull_request' && steps.cache-key.outputs.enabled == 'true'
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/fleet-test-cache
          key: ${{ steps.cache-key.outputs.cache_key }}
      # 3. 不信键：清单每个文件的哈希重算、拿分到这一台的文件当全集再减去盖住的；mode = all / files / none
      - name: 测试缓存：核对，算这次跑哪些
        if: github.event_name == 'pull_request' && steps.cache-key.outputs.enabled == 'true'
        id: cache-plan
        run: node packages/conventions/src/bin/ci-cache.ts plan --event "$GITHUB_EVENT_NAME" --tmp "$RUNNER_TEMP"
      # 交出去的是这一台分到的文件（BOX_FILE，一行一个）：缓存没开时全跑，files 只跑清单没盖住的那几个，none 不跑。
      # 每一轮都出 JSON 报告（下面的核对按它认实际跑了哪些）。CACHE_MODE 认不出直接红，不悄悄全跑也不悄悄跳过。
      - env:
          BOX_FILE: ${{ steps.box.outputs.box_file }}
          CACHE_MODE: ${{ steps.cache-plan.outputs.mode }}
          RUN_FILES: ${{ steps.cache-plan.outputs.run_files }}
          REPORT: ${{ runner.temp }}/fleet-test-out/report.json
        run: |
          set -euo pipefail
          mapfile -t box <"$BOX_FILE"
          report=(--reporter=default --reporter=github-actions --reporter=json --outputFile.json="$REPORT")
          case "${CACHE_MODE:-}" in
            "") pnpm exec vitest run "${box[@]}" "${report[@]}" ;;
            all) pnpm exec vitest run "${box[@]}" "${report[@]}" ;;
            files)
              mapfile -t files <"$RUN_FILES"
              pnpm exec vitest run "${files[@]}" "${report[@]}"
              ;;
            none) echo "测试缓存命中：这一台的输入没变、上一轮全绿，不跑 vitest" ;;
            *)
              echo "认不出的缓存模式「$CACHE_MODE」" >&2
              exit 1
              ;;
          esac
      # 跑完核对「实际跑的测试文件 == 分到的这一台」（命中缓存的：盖住的 + 跑的 == 分到的）：vitest 的位置参数是子串过滤，
      # 交给它清单也不等于它正好跑这些；少跑、多跑都红并点名（底线：没跑成不许当通过）。
      - name: 核对这一台跑的 == 分到的
        if: success()
        env:
          MATRIX: ${{ toJSON(matrix) }}
          CACHE_MODE: ${{ steps.cache-plan.outputs.mode }}
          REPORT: ${{ runner.temp }}/fleet-test-out/report.json
          STATE: ${{ runner.temp }}/fleet-test-cache-state.json
        run: node packages/conventions/src/bin/ci-box.ts verify --box "$MATRIX" --mode "${CACHE_MODE:-}" --report "$REPORT" --state "$STATE"
      # 4. 只在这一台全绿之后写清单（record 自己再核对一遍：每个文件要么核对过、要么报告里标了 passed），再存缓存
      - name: 测试缓存：全绿，写清单
        if: success() && github.event_name == 'pull_request' && (steps.cache-plan.outputs.mode == 'all' || steps.cache-plan.outputs.mode == 'files')
        id: cache-record
        run: node packages/conventions/src/bin/ci-cache.ts record --event "$GITHUB_EVENT_NAME" --tmp "$RUNNER_TEMP" --report "$RUNNER_TEMP/fleet-test-out/report.json"
      - name: 测试缓存：存清单
        if: success() && github.event_name == 'pull_request' && steps.cache-record.outputs.written == 'true' && steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/fleet-test-cache
          key: ${{ steps.cache-key.outputs.cache_key }}

  # 演示版打包，打包完扫产物：出现真名、内部叫法、GitHub 地址、源码对照文件就红（法国发布时也是这一道）
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./packages/web run build:demo

  # 装机脚本的检查：退出码 2 = 有项没跑成，同样算红，别让「没跑」冒充「通过」
  # deploy=all 时切成 3 台并行（ci-plan.ts 的 deployMatrix / DEPLOY_SHARDS，跑 run.sh --shard i/3；一台 100 秒上下，
  # 全套 300 秒上下）；deploy=ops（只改了 docs/ops.md 这类）只跑读 ops.md 的两块（run.sh --ops：端口表、place-file），
  # 不装依赖、不用 sudo（ops-only.test.sh 在全套里核对 --ops 两块真跑了、改坏 ops.md 会红）。
  # FLEET_TEST_SYSTEM_USERS=1：agent-scope-adopt.test.sh 建、删真系统账号的一段只在这里开（一次性的机器）。
  # sudo 会清掉带进来的环境变量，所以写在 sudo 的命令行上（这里 runner 的 sudo 规则是 ALL，命令行上给的放行）；
  # 万一没带过去，那一段报「没跑成」、这一步照样红，不会悄悄当成通过。
  deploy:
    needs: changes
    if: needs.changes.outputs.deploy_matrix != '[]'
    name: deploy (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.deploy_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.deploy == 'all'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ needs.changes.outputs.deploy == 'all' && 'pnpm' || '' }}
      - if: needs.changes.outputs.deploy == 'all'
        run: pnpm install --frozen-lockfile
      # 每一台腿都必须真跑（原来这步只认 deploy == 'all'，ops 那台就被跳过了：空跑还报绿，#662 第二意见）。
      # 参数从矩阵来、按数组展开，不拼进命令行；ops 那台不用 sudo、不碰系统账号。
      - name: deploy 检查（${{ matrix.label }}）
        env:
          ARGS: ${{ join(matrix.args, ' ') }}
          NEEDS_SUDO: ${{ matrix.sudo }}
        run: |
          set -euo pipefail
          read -ra args <<<"$ARGS"
          if [ "$NEEDS_SUDO" = "true" ]; then
            sudo FLEET_TEST_SYSTEM_USERS=1 bash deploy/test/run.sh "${args[@]}"
          else
            bash deploy/test/run.sh "${args[@]}"
          fi

  # 必过检查。逐个核对：changes 必须绿；lint 该跑的必须绿、本该跳过的必须是跳过；test、web、deploy 本该跑的必须绿、
  # 本该跳过的必须是跳过（packages/conventions/src/ci-plan.ts 的 ciVerdict）。
  # lint 里面几步各报各的（哪一步红写在它的 job 日志和最后的汇总步里）；汇总 job 认的是 lint 这个 job 的结论。
  check:
    if: always()
    needs: [changes, lint, test, web, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # package.json 也要：下面那步要读它的 engines.node 核对镜像自带的 Node 够不够
          sparse-checkout: |
            packages/conventions
            package.json
      # 不装 Node、不装依赖：这一步跑的是汇总入口（ci-plan.ts 的 ciVerdict），只用 Node 自带能力，runner 镜像自带的那版够用
      # （省掉 setup-node 约 3 秒）。但先核一下镜像自带的那版够不够：仓要 >=22.22（package.json 的 engines，直接跑 .ts 靠它的
      # 类型擦除）；镜像换了、自带版本低了就红，不靠运气。
      - env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          want=$(node -p "require('./package.json').engines.node.replace(/[^0-9.]/g,'')")
          have=$(node -p "process.versions.node")
          lowest=$(printf '%s\n' "$want" "$have" | sort -t. -k1,1n -k2,2n -k3,3n | head -1)
          if [ "$lowest" != "$want" ]; then
            echo "::error::runner 自带的 Node 是 $have，低于仓要求的 $want；这个 job 去掉了 setup-node，得加回来"
            exit 1
          fi
          node --version
          node packages/conventions/src/bin/ci-verdict.ts

