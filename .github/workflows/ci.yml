name: ci
# 一律全套、并行跑（决定 0101，design 第五节「CI 一律全套」）：PR、主线推送、每夜、手动都跑全部测试（按耗时分台）、web 打包、
# e2e 全套（两种屏宽，切 4 台）、deploy 全套（切 3 台），lint 每轮都跑；check 汇总核对「是全套（或主线同树复用）、该跑的跑了且绿」。
# 原来按改动预测只跑一部分，漏的到主线才红（7 天 18 轮、234 分钟）；全套墙钟 3.4 分钟，只比选测多 1 分钟上下，公开仓 Actions 分钟不收钱。
# 只剩两种省法，都是「输入完全相同、结果一样」：
# - PR 上的测试缓存（packages/conventions/src/ci-cache.ts）：同一 PR 重推，某一台的输入没变、上一轮全绿，就不再跑 vitest。
# - 主线同树复用：这次提交的树和某次成功的 PR 检查测的是同一棵（PR 那轮就是全套），test、web、e2e、deploy 就不重跑；对不上一律全套并留 ::warning::。
# 不做「取消前一轮」：发布闸认的是「这个提交自己那次绿」，取消了它就断。
#
# 改这里之前必须知道：
# - 必过检查（规则集「主线保护」）只认 check 这一个 job 名，别改名；它 needs 全部 job、if: always()，少 needs 一个就等于不拦那个。
# - 不用工作流级的 paths 过滤：必过检查每个 PR 都要触发，跳过的 job 由汇总核对（test/ci-plan.test.ts 核这份结构）。
# - 加 job 要同时加进 ci-plan.ts 的 PLANNED_JOBS（或 ALWAYS_JOBS）和 check 的 needs。
# - job 数 = 一个 PR 占的并发槽数（免费档同时 20 个）；小检查并进同一个 job 装一次依赖，墙钟不变、槽数少，别再拆回去。
# - 并进 lint 的几步各自 continue-on-error、最后统一判红：默认 step 红了后面就跳过，#566 就是 biome 先红把 tsc 跳过、漏了 7 个 TS2532（test/ci-plan.test.ts 钉着）。
on:
  pull_request:
    # opened、synchronize、reopened：hygiene 不扫 PR 标题、正文，改标题正文不用重跑（创始人 2026-09-28 拍，specs/169-Fusion形态/需求.md）。
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  # 每夜一轮：主线头上没有新提交时也按时跑一遍全套（外部依赖、镜像、时间相关的回归）。北京时间约 4 点，避开白天的并发槽。
  schedule:
    - cron: '23 20 * * *'
  # 手动在任意分支上跑一轮全套：gh workflow run ci.yml --ref <分支>。发版只认主线 push 那一轮，手动跑的不算。
  workflow_dispatch:
# 令牌只给读代码：这里的检查都只看检出来的文件，不读 GitHub 上的现状（#87：必过检查必须确定）。
permissions:
  contents: read
# 并发组：PR 按号分（新推的挤掉旧的）；别的事件按提交号分——主线每个提交各自一组，一个都不挤掉、不排队等前一个
# （原来按分支分，一组只许一个排队，7 天 49 轮被挤掉、那些提交没有结论，决定 0101）。主线推送不取消在跑的那一轮（它是发布的依据，#362）。
# 末尾带事件名：夜跑和主线推送可能是同一个提交，不带的话会互相顶掉（2026-10-05 第二意见挑出来的）。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # 各 job 的开关和测试分台：一律全套（ci-plan.ts 的 ciFullPlan），主线推送同树时整轮复用。列不出测试文件、装不了箱判红（退出码 2）。
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 只有这一个 job 多要 actions: read（读 PR 的运行记录找同树的检查）；别的 job 仍只读代码。
    permissions:
      contents: read
      actions: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      biome: ${{ steps.plan.outputs.biome }}
      tsc: ${{ steps.plan.outputs.tsc }}
      tests: ${{ steps.plan.outputs.tests }}
      web: ${{ steps.plan.outputs.web }}
      e2e: ${{ steps.plan.outputs.e2e }}
      deploy: ${{ steps.plan.outputs.deploy }}
      deploy_matrix: ${{ steps.plan.outputs.deploy_matrix }}
      reused: ${{ steps.plan.outputs.reused }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 主线推送：这次提交的树是不是和某次成功的 PR 检查（全套）测的同一棵（判法在 packages/conventions/src/main-reuse.ts）。是就让算计划那步
      # 把 test、web、e2e、deploy 标成「复用，不重跑」；对不上、查不到、读不到都只打 ::warning::，照旧全套。lint 仍每轮自己跑。
      - id: reuse
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node packages/conventions/src/bin/main-reuse.ts --workflow ci.yml >> "$GITHUB_OUTPUT"
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REUSE: ${{ steps.reuse.outputs.reuse }}
        run: node packages/conventions/src/bin/ci-plan.ts --event "$EVENT" --reuse "$REUSE"
      # PR：留下「这一轮测的是哪棵树」，供合并后主线那一轮查。只放在步骤名里，只读令牌就查得到；只有整轮成功才会被认。
      # HEAD 不是合并提交就写「无」，主线那边认不出就不复用。步骤名的写法由 main-reuse.ts 的 claimStepName 定，test/main-reuse.test.ts 核对这里对得上。
      - id: tested
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          parents=$(git rev-list --parents -n 1 HEAD | wc -w)
          if [ "$parents" = 3 ]; then
            echo "claim=tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          else
            echo "claim=无（HEAD 不是合并提交）" >> "$GITHUB_OUTPUT"
          fi
      - name: 已测的树 ${{ steps.tested.outputs.claim }}
        if: github.event_name == 'pull_request'
        run: echo "这一轮测的是这棵树（合并后主线那一轮据此复用，见 packages/conventions/src/main-reuse.ts）"

  # 一堆「装一次依赖、跑一条命令」的小检查并进这一个 job：原来 biome、tsc、docs、hygiene 各占一台，每台都有 25 秒的 checkout + setup-node + install 固定开销，
  # 四台占四个并发槽。这几步各自最慢 20 秒上下，串起来仍短于最慢的测试台（db 约 87 秒），所以整轮墙钟不变。
  #
  # 每一步 continue-on-error，最后汇总判红，不靠默认的「前一步红了后一步跳过」（那正是 #566 漏检的来路）。汇总还核「每一样都真跑了且绿」。
  # 这一步的脚本由 test/ci-plan.test.ts 抠出来真跑，每种红法都造一遍。
  #
  # 各步的分工（一律全套，决定 0101：每一样每轮都跑）：
  # - biome：整个仓。
  # - tsc -b：整棵树。
  # - doc_pointers、agents_test：文档里的路径、章节指针（doc-pointers 测试），和 agents/test（技能指针、规矩钉子）。每个 PR 都跑、不裁剪：挪文件会让指针指空。
  #   原来合成一步 docs，红了看不出是指针指空还是技能规矩红；拆成两样各自后台跑、各写各的结果，汇总点名红的是哪一样，墙钟不变（并行，最慢那样说了算）。
  # - 卫生检查一步（文件树和历史两遍在同一步里）：每个 PR 都跑，只报不挡（不进汇总判红，也不进必过名单）。真挡的是推之前的 pre-push 钩子和引擎推分支时的扫描（创始人 2026-09-28 拍，
  #   specs/169-Fusion形态/需求.md）；这里是早一步看到、接住钩子没装的情况。
  #   PR 检出到 pr/ 只当数据扫，执行的是主线上的 packages/hygiene（检出到 trusted/），且排在 pnpm install 和一切跑 PR 代码的步骤之前：
  #   否则 PR 自己改宽规则、白名单就能放过自己（#115 第二意见）。除扫文件树，还按提交扫历史，只在 pull_request 上跑。
  lint:
    # 不等 changes：和它并行，少等一跳。每一样每轮都跑，没有开关。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # PR 在 pr/、主线的卫生检查代码在 trusted/，并排放：biome check . 不会扫到 trusted/。
    defaults:
      run:
        working-directory: pr
    steps:
      # 按提交扫历史要完整提交图，默认浅克隆不够（base、head 两头都不在里面），所以 fetch-depth: 0。
      - uses: actions/checkout@v4
        with:
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          sparse-checkout: packages/hygiene
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 卫生检查在 CI 里只在这一处、这一步跑（2026-10-16 合成一步；本机 pnpm check 和 pre-push 钩子是推之前的快反馈，另算）。
      # 先扫 PR 最终的文件树（和 packages/hygiene/src/bin/check.ts 做的一样，只是代码取 trusted/、扫的是 pr/；退出码 2 = 没扫全，同样是红），
      # 再（只在 pull_request 上）按提交扫 base..head：先加后删的真密钥、提交说明里的真密钥，文件树那一遍看不见（和推送前的闸同一份判定）。两遍都跑完再判。
      - name: 卫生检查（主线上的代码，扫 PR 的文件和历史）
        id: hygiene
        continue-on-error: true
        env:
          TRUSTED: ${{ github.workspace }}/trusted
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          rc=0
          node --input-type=module -e '
          import { pathToFileURL } from "node:url";
          const { runCheck } = await import(pathToFileURL(`${process.env.TRUSTED}/packages/hygiene/src/check.ts`).href);
          const { code, lines } = runCheck({ root: process.cwd(), mustInclude: "packages/hygiene/src/rules.ts" });
          for (const line of lines) (code === 0 ? console.log : console.error)(line);
          process.exitCode = code;
          ' || rc=1
          if [ "$EVENT" = pull_request ]; then
            node "$TRUSTED/packages/hygiene/src/bin/ci-history.ts" --base "$BASE" --head "$HEAD" || rc=1
          fi
          exit "$rc"

      # ——从这里往下才跑 PR 里的代码（装依赖会跑 PR 的安装脚本）——
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: pr/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pr/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      # biome、tsc、doc_pointers、agents_test、deps、release_smoke 各自后台跑、各写各的日志和退出码，一样红不影响另外几样（#566：串行时 biome 先红就把 tsc 跳过）。
      # 结果写成 biome/tsc/doc_pointers/agents_test/deps/release_smoke = success | failure，由汇总逐样核对；这一步自己崩了、输出没写全，汇总读到空值同样判红。
      - name: biome、tsc、doc_pointers、agents_test、deps、release_smoke 并行跑
        id: checks
        env:
          LOGS: ${{ runner.temp }}/lint-checks
        run: |
          set -uo pipefail
          mkdir -p "$LOGS"
          start() {
            local name=$1
            shift
            # 各自记下跑了几秒（写进下面的分组标题）：几样并行，这一步的墙钟就是最慢那一样，不记就看不出该省哪个
            ( s=$SECONDS; "$@" >"$LOGS/$name.log" 2>&1; echo $? >"$LOGS/$name.rc"; echo $((SECONDS - s)) >"$LOGS/$name.secs" ) &
          }
          start biome pnpm exec biome check .
          start tsc pnpm exec tsc -b
          start doc_pointers pnpm exec vitest run packages/conventions/test/doc-pointers.test.ts
          start agents_test pnpm exec vitest run agents/test/
          # 未声明依赖（代码 import 了、自己包和仓根 package.json 都没写）：能不能碰巧找到看安装布局，法国会起不来
          start deps pnpm run deps:check
          # 照法国发版的样子（env -i、release.sh 的装依赖参数）装一版，从 fleet-api、fleet-engine 入口把每条 import 解析一遍
          start release_smoke pnpm run release:smoke
          wait
          for name in biome tsc doc_pointers agents_test deps release_smoke; do
            rc=$(cat "$LOGS/$name.rc" 2>/dev/null || echo missing)
            echo "::group::$name（退出码 $rc，$(cat "$LOGS/$name.secs" 2>/dev/null || echo 未知) 秒）"
            cat "$LOGS/$name.log" 2>/dev/null || echo "（没有日志）"
            echo "::endgroup::"
            if [ "$rc" = 0 ]; then echo "$name=success" >>"$GITHUB_OUTPUT"; else echo "::error::$name 没过（退出码 $rc）"; echo "$name=failure" >>"$GITHUB_OUTPUT"; fi
          done

      # 汇总：每一样都必须 success，哪一样不对 job 就红、连名字一起报。卫生检查只报不挡，红了只打 ::warning::。
      - name: 汇总（biome / tsc / doc_pointers / agents_test / deps / release_smoke 有一样不对这里就红）
        if: always()
        env:
          BIOME: ${{ steps.checks.outputs.biome }}
          TSC: ${{ steps.checks.outputs.tsc }}
          DOC_POINTERS: ${{ steps.checks.outputs.doc_pointers }}
          AGENTS_TEST: ${{ steps.checks.outputs.agents_test }}
          DEPS: ${{ steps.checks.outputs.deps }}
          RELEASE_SMOKE: ${{ steps.checks.outputs.release_smoke }}
          HYGIENE: ${{ steps.hygiene.outcome }}
        run: |
          set -euo pipefail
          bad=''
          # 参数：名字、这一步的结果
          verify() {
            [ "$2" = success ] || bad="$bad $1（$2，本该 success）"
          }
          verify biome "$BIOME"
          verify tsc "$TSC"
          verify doc_pointers "$DOC_POINTERS"
          verify agents_test "$AGENTS_TEST"
          verify deps "$DEPS"
          verify release_smoke "$RELEASE_SMOKE"
          if [ "$HYGIENE" = failure ]; then
            echo "::warning::卫生检查没过（只报不挡，看上面那一步的日志）"
          fi
          if [ -n "$bad" ]; then
            echo "::error::lint 里有检查不对：$bad"
            exit 1
          fi
          echo "lint 里每一样都过了：biome=$BIOME tsc=$TSC doc_pointers=$DOC_POINTERS agents_test=$AGENTS_TEST deps=$DEPS release_smoke=$RELEASE_SMOKE"

  # 测试分几台：全部测试文件（一律全套）→ test-split.ts 按 test-timings.json 耗时装箱，一台一份明确的文件清单（job 名就是那一台，如「2/5 · pg」）。
  # 耗时表只读仓里的 test-timings.json（引擎每天开 PR 从最近几轮 PR 的 CI 日志刷新，也可手跑 pnpm ci:timings）。不用 vitest --shard 按文件个数切：那样各台差得太远（#654 时 engine 三台 89/35/137 秒）。
  # 环境按这一台装进的文件算：要真 Postgres 的（matrix.pg）才起 postgres:16 容器，和法国同大版本；要 Temporal 命令行的（matrix.temporal）才装它，
  # 版本和校验和从 deploy/france.sh 读，CI 没给变量测试就直接红（test/support.ts）。
  # 每台跑完核对「实际跑的 == 分到的」（ci-box.ts verify）：vitest 的位置参数是子串过滤，多跑少跑都红，没跑成不许当通过。
  # PR 的结果缓存（packages/conventions/src/ci-cache.ts）：同一 PR 重推，这一台输入没变、上一轮全绿，就不再跑 vitest；缓存按 ref 分作用域。
  # 主线不靠这个缓存跳：它是自动发布的闸门，要么真跑，要么复用同树的 PR 检查（见 changes 的 reuse 步）。读不到、对不上、算不出，一律回来真跑。
  test:
    needs: changes
    if: needs.changes.outputs.tests != '[]'
    name: test (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # FLEET_TEST_PG_URL 只给 pg 台；放在 job 上是为了算缓存键的那一步也看得到（有没有真 Postgres 是键的一部分）。
    env:
      FLEET_TEST_PG_URL: ${{ matrix.pg && 'postgres://fleet_test:fleet_test@localhost:5432/fleet_test_admin' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.tests) }}
    steps:
      # postgres:16 只给 pg 台用，所以不用 services（每台都起、别的台白等约 12 秒），改成这一台自己 docker run。
      # 镜像用官方 postgres:16-alpine，先拉 AWS 公共镜像库（Docker Hub 对共享出口 IP 限速），拉不下来隔几秒再试，还不行换 Google 镜像站；e2e 那台是同一段，改一处两处一起改。
      # 整条放后台，装依赖之后再等，不和装依赖串着；后台进程活到 job 结束。
      - name: 起 postgres:16（只 pg 台，后台）
        if: matrix.pg
        run: |
          set -euo pipefail
          nohup bash -c '
            for img in public.ecr.aws/docker/library/postgres:16-alpine public.ecr.aws/docker/library/postgres:16-alpine \
              mirror.gcr.io/library/postgres:16-alpine mirror.gcr.io/library/postgres:16-alpine; do
              if docker pull -q "$img"; then
                exec docker run -d --name fleet-test-pg -p 5432:5432 \
                  -e POSTGRES_USER=fleet_test -e POSTGRES_PASSWORD=fleet_test -e POSTGRES_DB=fleet_test_admin "$img"
              fi
              sleep 4
            done
            echo "postgres:16-alpine 在 public.ecr.aws 和 mirror.gcr.io 各试两次都没拉下来" >&2
            exit 1
          ' > "$RUNNER_TEMP/fleet-test-pg-start.log" 2>&1 &
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        id: test-node
        with:
          node-version: 22
          cache: pnpm
      # 每台实际测试环境的读回声明；selfCheck 只认可严格唯一、成功的声明，旧 CI 回本机路径。
      - name: 已测的环境 node=${{ steps.test-node.outputs.node-version }}
        run: ':'
      - run: pnpm install --frozen-lockfile
      - name: 等 postgres:16 起来（只 pg 台）
        if: matrix.pg
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            if docker exec fleet-test-pg pg_isready -U fleet_test -d fleet_test_admin >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/fleet-test-pg-start.log" >&2 || true
          docker logs fleet-test-pg >&2 || true
          echo "postgres:16 起了 90 秒还没好（后台 docker run 的输出在上面）" >&2
          exit 1
      # useEnv/createEnv 可落在任一台；与只供 createRealEnv 的 CLI 分开准备。
      - uses: actions/cache@v4
        with:
          path: ~/.cache/fleet-temporal-test-server
          key: temporal-test-server-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/conventions/src/temporal-test-server.ts') }}
      - name: 准备时间跳跃服务（固定官方制品，缓存命中也核 SHA256）
        run: pnpm test:temporal-server
      # Temporal 命令行用和法国同一版，版本和校验和从 deploy/france.sh 读（只有一份），缓存按版本 + 校验和。
      - name: Temporal 命令行的版本（和法国同版）
        if: matrix.temporal
        id: temporal
        run: |
          set -euo pipefail
          version=$(sed -n 's/^TEMPORAL_CLI_VERSION=//p' deploy/france.sh)
          sha=$(sed -n 's/^TEMPORAL_CLI_SHA256=//p' deploy/france.sh)
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || ! $sha =~ ^[0-9a-f]{64}$ ]]; then
            echo "deploy/france.sh 里没读到 Temporal 命令行的版本或校验和（version=$version sha=$sha）" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: matrix.temporal
        id: temporal-cache
        with:
          path: ~/.cache/fleet-temporal-cli/${{ steps.temporal.outputs.version }}
          key: temporal-cli-${{ runner.os }}-${{ steps.temporal.outputs.version }}-${{ steps.temporal.outputs.sha }}
      - name: 下载 Temporal 命令行（缓存没命中时；校验和对不上就红）
        if: matrix.temporal && steps.temporal-cache.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.temporal.outputs.version }}
          SHA: ${{ steps.temporal.outputs.sha }}
        run: |
          set -euo pipefail
          dir="$HOME/.cache/fleet-temporal-cli/$VERSION"
          mkdir -p "$dir"
          tgz="$RUNNER_TEMP/temporal-cli.tgz"
          curl -fsSL --retry 3 -o "$tgz" \
            "https://github.com/temporalio/cli/releases/download/v$VERSION/temporal_cli_${VERSION}_linux_amd64.tar.gz"
          echo "$SHA  $tgz" | sha256sum -c -
          tar -xzf "$tgz" -C "$dir" temporal
      - name: 核对版本，交给测试
        if: matrix.temporal
        env:
          VERSION: ${{ steps.temporal.outputs.version }}
        run: |
          set -euo pipefail
          cli="$HOME/.cache/fleet-temporal-cli/$VERSION/temporal"
          "$cli" --version
          "$cli" --version | grep -qF "$VERSION"
          echo "FLEET_TEST_TEMPORAL_CLI=$cli" >> "$GITHUB_ENV"
      # 这一台分到哪些测试文件：矩阵里那份 JSON 过 ci-box.ts 核一遍，一行一个写进 BOX_FILE；后面按数组交给 vitest，不拼进命令行。
      - name: 这一台跑哪些文件
        id: box
        env:
          MATRIX: ${{ toJSON(matrix) }}
        run: |
          set -euo pipefail
          box_file="$RUNNER_TEMP/fleet-test-box-files.txt"
          mkdir -p "$RUNNER_TEMP/fleet-test-out"
          node packages/conventions/src/bin/ci-box.ts files --box "$MATRIX" --out "$box_file"
          echo "box_file=$box_file" >> "$GITHUB_OUTPUT"
      # —— PR 上的测试结果缓存（只 pull_request；说明见 test job 上面的注释）。
      # 1. 算键（这一台分到的文件、它们的哈希、源码闭包、环境身份）；算不出 enabled=false，后面几步都跳过、测试全跑
      - name: 测试缓存：算键
        if: github.event_name == 'pull_request'
        id: cache-key
        env:
          BOX_FILE: ${{ steps.box.outputs.box_file }}
          LABEL: ${{ matrix.label }}
          TEMPORAL: ${{ matrix.temporal && format('{0} {1}', steps.temporal.outputs.version, steps.temporal.outputs.sha) || '' }}
        run: node packages/conventions/src/bin/ci-cache.ts key --event "$GITHUB_EVENT_NAME" --tmp "$RUNNER_TEMP" --box-file "$BOX_FILE" --label "$LABEL" --temporal "$TEMPORAL"
      # 2. 取上一轮存的清单（键完全一样才命中，不用 restore-keys）
      - name: 测试缓存：取清单
        if: github.event_name == 'pull_request' && steps.cache-key.outputs.enabled == 'true'
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/fleet-test-cache
          key: ${{ steps.cache-key.outputs.cache_key }}
      # 3. 不信键：清单每个文件的哈希重算，拿分到这一台的文件当全集再减去盖住的；mode = all / files / none
      - name: 测试缓存：核对，算这次跑哪些
        if: github.event_name == 'pull_request' && steps.cache-key.outputs.enabled == 'true'
        id: cache-plan
        run: node packages/conventions/src/bin/ci-cache.ts plan --event "$GITHUB_EVENT_NAME" --tmp "$RUNNER_TEMP"
      # 交给 vitest 的是这一台分到的文件：缓存没开时全跑，files 只跑清单没盖住的，none 不跑；CACHE_MODE 认不出直接红。每一轮都出 JSON 报告。
      - env:
          BOX_FILE: ${{ steps.box.outputs.box_file }}
          CACHE_MODE: ${{ steps.cache-plan.outputs.mode }}
          RUN_FILES: ${{ steps.cache-plan.outputs.run_files }}
          REPORT: ${{ runner.temp }}/fleet-test-out/report.json
        run: |
          set -euo pipefail
          mapfile -t box <"$BOX_FILE"
          report=(--reporter=default --reporter=github-actions --reporter=json --outputFile.json="$REPORT")
          case "${CACHE_MODE:-}" in
            "") pnpm exec vitest run "${box[@]}" "${report[@]}" ;;
            all) pnpm exec vitest run "${box[@]}" "${report[@]}" ;;
            files)
              mapfile -t files <"$RUN_FILES"
              pnpm exec vitest run "${files[@]}" "${report[@]}"
              ;;
            none) echo "测试缓存命中：这一台的输入没变、上一轮全绿，不跑 vitest" ;;
            *)
              echo "认不出的缓存模式「$CACHE_MODE」" >&2
              exit 1
              ;;
          esac
      # 跑完核对「实际跑的测试文件 == 分到的这一台」（命中缓存的：盖住的 + 跑的 == 分到的）：少跑、多跑都红并点名。
      - name: 核对这一台跑的 == 分到的
        if: success()
        env:
          MATRIX: ${{ toJSON(matrix) }}
          CACHE_MODE: ${{ steps.cache-plan.outputs.mode }}
          REPORT: ${{ runner.temp }}/fleet-test-out/report.json
          STATE: ${{ runner.temp }}/fleet-test-cache-state.json
        run: node packages/conventions/src/bin/ci-box.ts verify --box "$MATRIX" --mode "${CACHE_MODE:-}" --report "$REPORT" --state "$STATE"
      # 4. 只在这一台全绿之后写清单（record 自己再核对一遍），再存缓存
      - name: 测试缓存：全绿，写清单
        if: success() && github.event_name == 'pull_request' && (steps.cache-plan.outputs.mode == 'all' || steps.cache-plan.outputs.mode == 'files')
        id: cache-record
        run: node packages/conventions/src/bin/ci-cache.ts record --event "$GITHUB_EVENT_NAME" --tmp "$RUNNER_TEMP" --report "$RUNNER_TEMP/fleet-test-out/report.json"
      - name: 测试缓存：存清单
        if: success() && github.event_name == 'pull_request' && steps.cache-record.outputs.written == 'true' && steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/fleet-test-cache
          key: ${{ steps.cache-key.outputs.cache_key }}

  # 驾驶舱前端打包（发布时也是这一道）：打不出来就红。
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./packages/web run build

  # 驾驶舱用户视角 e2e（#930）：真 Postgres 16 + 真后端（packages/api/src/main.ts，线上同一个入口）+ 真前端 + Chromium，站在创始人角度逐页走（packages/web/e2e）。
  # 决定 0101：PR 和主线都跑全套（playwright 配置里的两种屏宽都跑），是合并闸也是发版闸；只有主线同树复用 PR 的结果时跳过（changes 的 e2e 输出空串）。
  # 红了这一轮 check 红：主线头 CI 不绿就不发版（法国的自动发版只认主线头 ci.yml 这一轮 conclusion=success）。
  # 本机（Windows + 本机 Chrome + Windows 版 PG）和这里（Linux + Chromium + 容器 PG）的差别：浏览器走 E2E_BROWSER_CHANNEL=chromium，管理连接串指向容器；库名、端口、顺序和本机一样。
  # 每台 4 个 worker、每个 worker 一整套环境（packages/web/e2e/support/fixtures.ts）；全套切成 4 台，缩短 e2e 关键路径。
  # 保持 fullyParallel: false，同一文件里的用例按原顺序跑；每个屏宽的文件可落到不同台，不再让两台各扛一个屏宽。
  # 分片经 --shard 传入；分片空了照绿（--pass-with-no-tests）。
  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'all'
    name: e2e (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    timeout-minutes: 15
    env:
      # 一次性 runner 上的一次性容器，只有本机回环连得到：用 trust 认证，连接串里不放密码
      E2E_PG_ADMIN_URL: postgres://postgres@127.0.0.1:5432/postgres
      E2E_BROWSER_CHANNEL: chromium
    steps:
      # 拉镜像撞限速的重试和换镜像站，同 test 的 pg 台那一段（改一处两处一起改）
      - name: 起 postgres:16（后台）
        run: |
          set -euo pipefail
          nohup bash -c '
            for img in public.ecr.aws/docker/library/postgres:16-alpine public.ecr.aws/docker/library/postgres:16-alpine \
              mirror.gcr.io/library/postgres:16-alpine mirror.gcr.io/library/postgres:16-alpine; do
              if docker pull -q "$img"; then
                exec docker run -d --name fleet-e2e-pg -p 5432:5432 \
                  -e POSTGRES_USER=postgres -e POSTGRES_HOST_AUTH_METHOD=trust "$img"
              fi
              sleep 4
            done
            echo "postgres:16-alpine 在 public.ecr.aws 和 mirror.gcr.io 各试两次都没拉下来" >&2
            exit 1
          ' > "$RUNNER_TEMP/fleet-e2e-pg-start.log" 2>&1 &
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 浏览器缓存按锁定 Playwright 版本；共用准备器每台机器实装系统库，APT 仅限 Ubuntu 必要源。
      - name: Playwright 版本
        id: pw
        run: |
          set -euo pipefail
          version=$(pnpm --filter @fleet-dao/web exec playwright --version | sed -n 's/^Version \([0-9][0-9.]*\)$/\1/p')
          if [ -z "$version" ]; then
            echo "读不到 Playwright 的版本" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        env:
          # 可选浏览器缓存下载停滞时及时按 miss 回退；下面仍安装 Chromium 和系统库。
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: 装 Chromium 和系统库
        run: node packages/conventions/src/bin/ci-browser.ts
      - name: 等 postgres:16 起来
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            if docker exec fleet-e2e-pg pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          if [ -f "$RUNNER_TEMP/fleet-e2e-pg-start.log" ]; then cat "$RUNNER_TEMP/fleet-e2e-pg-start.log" >&2; fi
          if ! docker logs fleet-e2e-pg >&2; then echo "（拿不到容器日志）" >&2; fi
          echo "postgres:16 起了 90 秒还没好（后台 docker run 的输出在上面）" >&2
          exit 1
      # 全套：不给 spec 参数，playwright 配置里的全部 spec、全部屏宽（项目）都跑，按完整文件切成四片、保留文件内顺序
      - name: 驾驶舱 e2e
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          # 隔离集（packages/web/e2e/quarantine.json）不在 ci 里跑：e2e-quarantine.yml 每天定时跑
          E2E_QUARANTINE: skip
        run: pnpm --filter @fleet-dao/web e2e --shard="$SHARD" --pass-with-no-tests
      # 隔离集不在这里跑（2026-10-16 挪走）：每天定时跑一次、可手动触发，见 e2e-quarantine.yml（照跑照报，本来也不挡）。
      # 偶发和隔离集的结局写进 job 摘要（判法 packages/conventions/src/e2e-flaky.ts）；近 10 轮统计、开单在 e2e-flaky.yml
      - name: 偶发与隔离集汇总
        if: always()
        run: node packages/conventions/src/bin/e2e-flaky.ts summary _tmp/e2e/results.json >> "$GITHUB_STEP_SUMMARY"
      # 总是留：跑过页面的截图（support/fixtures.ts 的 shot 夹具存的）是界面 PR 的截图证据，红了还有报告和各进程日志。都在仓根 _tmp/e2e/（公开仓：只有 e2e 自己造的假数据）
      # 名字带第几次运行（run_attempt）：主线红了 ci-rerun.yml 会重跑失败的 job，同一个运行号下名字撞了第二次就传不上去（#2747）
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: _tmp/e2e/
          retention-days: 7
          if-no-files-found: warn

  # 装机脚本的检查：退出码 2 = 有项没跑成，同样算红，别让「没跑」冒充「通过」。
  # 全套切 3 台并行（ci-plan.ts 的 deployMatrix，一台 100 秒上下）；矩阵来自 changes，CI 里一律 all（决定 0101），同树复用时空、整个 job 跳过。
  # deployMatrix 还认 ops（一台、不装依赖、不用 sudo），只是 CI 的计划不再出它，下面装依赖那几步的条件为它留着。
  # FLEET_TEST_SYSTEM_USERS=1 只在这里开（一次性的机器）。sudo 会清掉环境变量，所以写在命令行上；漏带过去的那段会报「没跑成」，不会悄悄当通过。
  deploy:
    needs: changes
    if: needs.changes.outputs.deploy_matrix != '[]'
    name: deploy (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.deploy_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.deploy == 'all'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ needs.changes.outputs.deploy == 'all' && 'pnpm' || '' }}
      - if: needs.changes.outputs.deploy == 'all'
        run: pnpm install --frozen-lockfile
      # GitHub 的 runner 镜像在 /etc/skel 里放了几个 G 的工具链，测试每建一个带家目录的账号都要整份拷一遍（login-user 头一条用例 36 秒全在拷它）。
      # 这里只留 /etc/skel 顶层的普通文件（.profile 这类，测试要看），工具链目录挪开；只动这台一次性的 CI 机器，改不成就照原样跑（只是慢），不挡。
      - name: CI 机器上给 /etc/skel 瘦身（建测试账号不再拷几个 G 的工具链）
        if: matrix.sudo
        # SKEL 只给测试换成临时目录用（packages/conventions/test/ci-plan.test.ts 抠出这段脚本真跑）；CI 上不设，就是 /etc/skel。
        run: |
          set -uo pipefail
          skel=${SKEL:-/etc/skel}
          echo "原来的 $skel：$(sudo du -sh "$skel" 2>/dev/null | cut -f1)，$(ls -A "$skel" | xargs)"
          if sudo mkdir -p "$skel.slim" && sudo find "$skel" -maxdepth 1 -type f -exec cp -p {} "$skel.slim/" ';' &&
            sudo mv "$skel" "$skel.ci-full" && sudo mv "$skel.slim" "$skel"; then
            echo "瘦身后的 $skel：$(ls -A "$skel" | xargs)"
          else
            # 挪开了原来的、新的却没挪进去：把原来的挪回去，保证它一定在；挪不回去就红（后面建账号会拿不到默认文件）
            if [ ! -d "$skel" ] && [ -d "$skel.ci-full" ] && ! sudo mv "$skel.ci-full" "$skel"; then
              echo "::error::$skel 瘦身半路失败、原来的也挪不回去了"
              exit 1
            fi
            if [ ! -d "$skel" ]; then
              echo "::error::$skel 不见了"
              exit 1
            fi
            echo "::warning::$skel 没瘦成，照原样跑（只是慢）：现在是 $(ls -A "$skel" | xargs)"
          fi
      # 每一台腿都必须真跑（原来只认 deploy == 'all'，ops 那台被跳过、空跑还报绿）。参数从矩阵来、按数组展开，不拼进命令行；ops 那台不用 sudo。
      - name: deploy 检查（${{ matrix.label }}）
        env:
          ARGS: ${{ join(matrix.args, ' ') }}
          NEEDS_SUDO: ${{ matrix.sudo }}
        run: |
          set -euo pipefail
          read -ra args <<<"$ARGS"
          if [ "$NEEDS_SUDO" = "true" ]; then
            sudo FLEET_TEST_SYSTEM_USERS=1 bash deploy/test/run.sh "${args[@]}"
          else
            bash deploy/test/run.sh "${args[@]}"
          fi

  # 必过检查：changes 必须绿；lint、test、web、e2e、deploy 各自该跑的必须绿、该跳过的必须是跳过（packages/conventions/src/bin/ci-verdict.ts 调 ciVerdict）。
  # lint 里面几步各报各的（哪一步红写在它的 job 日志和汇总步里）；汇总 job 认的是 lint 这个 job 的结论。
  check:
    if: always()
    needs: [changes, lint, test, web, e2e, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # package.json 也要：下面那步要读它的 engines.node 核对镜像自带的 Node 够不够
          sparse-checkout: |
            packages/conventions
            package.json
      # 不装 Node、不装依赖（省掉 setup-node 约 3 秒）：只跑汇总入口，靠 Node 自带的类型擦除直接跑 .ts。所以先核镜像自带的版本够不够 engines（>=22.22），
      # 换了镜像、版本低了就红，不靠运气。
      - env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          want=$(node -p "require('./package.json').engines.node.replace(/[^0-9.]/g,'')")
          have=$(node -p "process.versions.node")
          lowest=$(printf '%s\n' "$want" "$have" | sort -t. -k1,1n -k2,2n -k3,3n | head -1)
          if [ "$lowest" != "$want" ]; then
            echo "::error::runner 自带的 Node 是 $have，低于仓要求的 $want；这个 job 去掉了 setup-node，得加回来"
            exit 1
          fi
          node --version
          node packages/conventions/src/bin/ci-verdict.ts

