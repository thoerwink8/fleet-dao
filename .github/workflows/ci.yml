name: network-probe
run-name: network-probe issue 3268 single read
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  network-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Single trusted source read with native network diagnostics
        run: node packages/conventions/src/bin/policy-network-probe.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
