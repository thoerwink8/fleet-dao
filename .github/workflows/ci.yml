name: ci
# 按改动跑、并行跑（design 第五节「CI 按改动跑」）：changes 算出这次改了什么、哪几个 job 要跑（packages/conventions/src/ci-plan.ts），
# biome、tsc、test、web、deploy 看它给的开关；hygiene、docs 每次都跑；check 汇总核对「该跑的跑了且绿、不该跑的确实跳过」
# ——hygiene 是例外，它每次都跑但只报不挡，红了不算进这条判定（真正挡的是推之前，见 hygiene job 的注释）。
# 主线推送一律全跑，兜底按改动算漏了的。
# 改这里之前必须知道：
# - 必过检查（规则集「主线保护」）只认 check 这一个 job 名，别改名；它 needs 全部 job、if: always()，少 needs 一个就等于不拦那个。
# - 不用工作流级的 paths 过滤：必过检查要每个 PR 都触发，跳过的 job 由汇总核对（test/ci-plan.test.ts 核这份文件的结构）。
# - 加 job 要同时加进 ci-plan.ts 的 PLANNED_JOBS（或 ALWAYS_JOBS）和 check 的 needs。
on:
  pull_request:
    # opened、synchronize、reopened（GitHub 默认这三个）：hygiene 不扫 PR 标题、正文了（只扫文件树和提交历史），
    # 改标题正文不用重跑（创始人 2026-09-28 傍晚拍，specs/169-Fusion形态/需求.md）。
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
# 令牌只给读代码：这里的检查都只看检出来的文件，不读 GitHub 上的现状（#87：必过检查必须确定）。
permissions:
  contents: read
# 并发组 PR 按号分、推主线按分支分，两边不撞：pull_request 事件的 github.ref 是 refs/pull/<N>/merge，push 到 main
# 是 refs/heads/main。按 PR 号分组更直接，也防着触发类型以后再加回 edited 之类——已经合了的 PR 被编辑触发一轮时，
# GitHub 给它的 github.ref 会是 refs/heads/main，按 github.ref 分组就会和主线那一轮撞上、把主线的全量挤掉（曾经出过
# 这个事：主线头上 check 红、自动发布不发，2026-09-27 #283）。
# 只有 PR 上新的一轮挤掉旧的；主线推送不挤掉在跑的那一轮：它跑完，新推送排着（同组只排一个，更新的顶掉更旧的）。
# 要是也挤，合并比主线全量（3–4 分钟）还密时每一轮都被下一次推送挤成 cancelled，一个全绿的提交都没有，
# 自动发布往回也找不到能发的（2026-09-27 夜最近 100 次主线 CI 被挤掉 26 次，#362）。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # 这次改了什么 → 各 job 的开关。PR 按 git diff origin/<目标分支>...HEAD 算（HEAD 是 GitHub 造的合并提交，比的就是合进去会带进来的改动）；
  # base 拿不到、diff 失败都判红（退出码 2），认不出的路径、读不出的依赖图升成全跑。
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      biome: ${{ steps.plan.outputs.biome }}
      tsc: ${{ steps.plan.outputs.tsc }}
      tests: ${{ steps.plan.outputs.tests }}
      web: ${{ steps.plan.outputs.web }}
      deploy: ${{ steps.plan.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: node packages/conventions/src/bin/ci-plan.ts --event "$EVENT" --base "origin/$BASE"

  # 卫生检查：每个 PR 都跑、不裁剪，但只报不挡（不进 check 的必过名单，见下面 check job）——真正挡的是推之前：
  # pre-push 钩子、引擎推分支时的扫描（创始人 2026-09-28 傍晚拍，specs/169-Fusion形态/需求.md）。这里留着是为了
  # 早一步看到（PR 页面上直接标红）、也接住钩子没装或被跳过的情况。
  # PR 检出到 pr/ 只当数据扫；执行的是目标分支（主线）上那份 packages/hygiene，检出到 trusted/，不装依赖、不跑安装
  # 脚本——防的是这个 PR 自己改宽规则、白名单，当场就用上放过自己（#115 第二意见）。改卫生检查的规则、白名单要
  # 合进主线之后才用上——要加白名单的，先单独合一个只改白名单的 PR。不等 changes。
  # 除了扫 PR 最终的文件树，还按提交扫这个 PR 的历史（先加后删的、提交说明），只在 pull_request 事件上跑（push 到
  # main 没有 base/head 这两个概念）。
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: pr
          # 按提交扫这个 PR 的历史（下面）要完整提交图：默认浅克隆只有 GitHub 造的这一个合并提交，base、head 两头
          # 都不在里面。
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          sparse-checkout: packages/hygiene
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 和 packages/hygiene/src/bin/check.ts 做的一样，只是代码取 trusted/、扫的是 pr/。退出码 2 = 没扫全，同样是红
      - name: 卫生检查（主线上的代码，扫 PR 的文件）
        working-directory: pr
        env:
          TRUSTED: ${{ github.workspace }}/trusted
        run: |
          node --input-type=module -e '
          import { pathToFileURL } from "node:url";
          const { runCheck } = await import(pathToFileURL(`${process.env.TRUSTED}/packages/hygiene/src/check.ts`).href);
          const { code, lines } = runCheck({ root: process.cwd(), mustInclude: "packages/hygiene/src/rules.ts" });
          for (const line of lines) (code === 0 ? console.log : console.error)(line);
          process.exitCode = code;
          '
      # 上面那步只看 PR 最终的文件树：先加后删的真密钥、提交说明里的真密钥推上去就公开了，那步看不见。这里按提交扫
      # base..head，和推送前的闸（packages/hygiene/src/prepush.ts）、引擎推分支同一份判定（historyArgs / scanHistory）。
      - name: 卫生检查（主线上的代码，按提交扫这个 PR 的历史）
        if: github.event_name == 'pull_request'
        working-directory: pr
        env:
          TRUSTED: ${{ github.workspace }}/trusted
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          node "$TRUSTED/packages/hygiene/src/bin/ci-history.ts" --base "$BASE" --head "$HEAD"

  # 文档指针、skill 指针：每个 PR 都跑、不裁剪（改名挪文件也会让文档里的指针指空）。不等 changes。
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run packages/conventions/test/doc-pointers.test.ts agents/test/

  # biome 和 tsc 各一个 job：放在一个 job 的连续 step 里的话，biome 先红 = 后面的 tsc 被跳过（GitHub 默认
  # step 失败就停），类型错一路没人看见（#566 就是这么漏的 7 个 TS2532）。拆开两个各自报告、两份都要绿。
  biome:
    needs: changes
    if: needs.changes.outputs.biome == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome check .

  # tsc -b 只查受影响的项目（各自 tsconfig 的 include 里跨包导入的源码一起查）；全跑时查整棵树
  tsc:
    needs: changes
    if: needs.changes.outputs.tsc != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - env:
          TSC: ${{ needs.changes.outputs.tsc }}
        run: |
          set -euo pipefail
          if [[ $TSC == all ]]; then pnpm exec tsc -b; else read -ra projects <<<"$TSC"; pnpm exec tsc -b "${projects[@]}"; fi

  # engine 切两台、db 一台、其余切三台（ci-plan.ts 的 TEST_SHARDS，vitest --shard 按测试文件均分；包少时 rest 不切）；
  # 只跑受影响的包（改到的 + 依赖它们的）。
  # db 分片旁边起一个 postgres:16 服务容器（和法国生产同大版本，ops.md 第二节），测试经 FLEET_TEST_PG_URL 连上，
  # 第一次跑迁移建模板库、之后每个测试文件 CREATE DATABASE … TEMPLATE 克隆一份（#220）：一个测试进程的内存从
  # ~1G 降到 ~0.3G，不再每个进程各建一份内存 PGlite。engine、rest 不连这张库，照 PGlite 走；本机没设这个变量也
  # 照 PGlite 走（packages/db/src/testing.ts，ops.md 第九节「CI 测试的 Postgres 服务」）。
  test:
    needs: changes
    if: needs.changes.outputs.tests != '[]'
    name: test (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.tests) }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fleet_test
          POSTGRES_PASSWORD: fleet_test
          POSTGRES_DB: fleet_test_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleet_test -d fleet_test_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 引擎有几条测试要真的 Temporal 开发服务端（测试服务端和真服务端行为不同的地方）：用和法国同一版的命令行起，
      # 版本和校验和从 deploy/france.sh 读（只有一份），缓存按版本 + 校验和。测试里 CI 没给这个变量就直接红（test/support.ts）。
      - name: Temporal 命令行的版本（和法国同版）
        if: matrix.temporal
        id: temporal
        run: |
          set -euo pipefail
          version=$(sed -n 's/^TEMPORAL_CLI_VERSION=//p' deploy/france.sh)
          sha=$(sed -n 's/^TEMPORAL_CLI_SHA256=//p' deploy/france.sh)
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || ! $sha =~ ^[0-9a-f]{64}$ ]]; then
            echo "deploy/france.sh 里没读到 Temporal 命令行的版本或校验和（version=$version sha=$sha）" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: matrix.temporal
        id: temporal-cache
        with:
          path: ~/.cache/fleet-temporal-cli/${{ steps.temporal.outputs.version }}
          key: temporal-cli-${{ runner.os }}-${{ steps.temporal.outputs.version }}-${{ steps.temporal.outputs.sha }}
      - name: 下载 Temporal 命令行（缓存没命中时；校验和对不上就红）
        if: matrix.temporal && steps.temporal-cache.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.temporal.outputs.version }}
          SHA: ${{ steps.temporal.outputs.sha }}
        run: |
          set -euo pipefail
          dir="$HOME/.cache/fleet-temporal-cli/$VERSION"
          mkdir -p "$dir"
          tgz="$RUNNER_TEMP/temporal-cli.tgz"
          curl -fsSL --retry 3 -o "$tgz" \
            "https://github.com/temporalio/cli/releases/download/v$VERSION/temporal_cli_${VERSION}_linux_amd64.tar.gz"
          echo "$SHA  $tgz" | sha256sum -c -
          tar -xzf "$tgz" -C "$dir" temporal
      - name: 核对版本，交给测试
        if: matrix.temporal
        env:
          VERSION: ${{ steps.temporal.outputs.version }}
        run: |
          set -euo pipefail
          cli="$HOME/.cache/fleet-temporal-cli/$VERSION/temporal"
          "$cli" --version
          "$cli" --version | grep -qF "$VERSION"
          echo "FLEET_TEST_TEMPORAL_CLI=$cli" >> "$GITHUB_ENV"
      # 参数是 ci-plan 给的包目录（或全跑时 rest 的 --exclude）；经环境变量传、按数组展开，不拼进命令行
      # FLEET_TEST_PG_URL 只给 db 分片：连旁边的 postgres:16 服务、从模板库克隆各自的测试库（#220）。
      # 不设给 engine、rest：它们的测试照 PGlite 走，免得挂上这张白起的库。
      - env:
          ARGS: ${{ join(matrix.args, ' ') }}
          FLEET_TEST_PG_URL: ${{ matrix.name == 'db' && 'postgres://fleet_test:fleet_test@localhost:5432/fleet_test_admin' || '' }}
        run: |
          set -euo pipefail
          read -ra args <<<"$ARGS"
          pnpm exec vitest run "${args[@]}"

  # 演示版打包，打包完扫产物：出现真名、内部叫法、GitHub 地址、源码对照文件就红（法国发布时也是这一道）
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./packages/web run build:demo

  # 装机脚本的检查：退出码 2 = 有项没跑成，同样算红，别让「没跑」冒充「通过」
  # deploy=all 跑全套；deploy=ops（只改了 docs/ops.md 这类）只跑读 ops.md 的两块（run.sh --ops：端口表、place-file），
  # 不装依赖、不用 sudo（ops-only.test.sh 在全套里核对 --ops 两块真跑了、改坏 ops.md 会红）。
  # FLEET_TEST_SYSTEM_USERS=1：agent-scope-adopt.test.sh 建、删真系统账号的一段只在这里开（一次性的机器）。
  # sudo 会清掉带进来的环境变量，所以写在 sudo 的命令行上（这里 runner 的 sudo 规则是 ALL，命令行上给的放行）；
  # 万一没带过去，那一段报「没跑成」、这一步照样红，不会悄悄当成通过。
  deploy:
    needs: changes
    if: needs.changes.outputs.deploy == 'all' || needs.changes.outputs.deploy == 'ops'
    name: deploy (${{ needs.changes.outputs.deploy }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.deploy == 'all'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ needs.changes.outputs.deploy == 'all' && 'pnpm' || '' }}
      - if: needs.changes.outputs.deploy == 'all'
        run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.deploy == 'all'
        run: sudo FLEET_TEST_SYSTEM_USERS=1 bash deploy/test/run.sh
      - if: needs.changes.outputs.deploy == 'ops'
        run: bash deploy/test/run.sh --ops

  # 必过检查。逐个核对：changes、docs 必须绿；biome、tsc、test、web、deploy 本该跑的必须绿、本该跳过的必须是跳过
  # （packages/conventions/src/ci-plan.ts 的 ciVerdict）。hygiene 只报不挡：仍然 needs 它、等它跑完，状态在 PR 上
  # 看得见，但它红不算进这里的判定（创始人 2026-09-28 傍晚拍，specs/169-Fusion形态/需求.md）。
  check:
    if: always()
    needs: [changes, hygiene, docs, biome, tsc, test, web, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: packages/conventions
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node packages/conventions/src/bin/ci-verdict.ts
