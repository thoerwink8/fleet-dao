name: debt
# 欠账检查的全量版（#67，packages/conventions/src/debt.ts）：pnpm check 里查的两样（文档里推后的话带着开着的单号、
# 需求.md 写了怎么算做完）之外，另查开着的 issue 在主线上都有 specs/<号>-<短名>/需求.md（开单一天内不算欠）。
# 这一样看的是 GitHub 上的现状，放进 PR 的必过检查会让两个各带自己需求文档的 PR 互相卡死，所以只在主线上跑：
# 每次合并后、每天一次。只用 Node 自带的，不用装依赖。退出码 2 = 没查成，同样是红。
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
concurrency:
  group: debt
  cancel-in-progress: true
permissions:
  contents: read
  issues: read
jobs:
  debt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node packages/conventions/src/bin/debt-check.ts --open-issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
