name: debt
# 欠账检查（#67、#87，packages/conventions/src/debt.ts），只报告、不挡任何 PR（创始人 2026-09-26「流程只为快」）。
# debt-docs：只看文件的那一半（活文档里推后的话带没带单号），主线推送和每天跑；
#   查出来的在检查页上列出来，这一步失败也不把 PR 标红（continue-on-error），也别把它设成必过检查。
# debt-live：看 GitHub 现状的那一半（挂的单号开没开着）。结果随单子开关、随时间变，
#   只在主线上每天跑、每次合并后跑，查出来的留言到对应的单上（同一条只留一次）。
# 退出码：没欠账或都留了言 = 0；有落不到单上的 = 1；没查成（读不到 GitHub、留言没留成）= 2。
# 不在 PR 上跑：只报不挡的检查在 PR 页上永远是绿勾，只添一行噪音；主线推送、每天各一次足够（#654）。
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
concurrency:
  group: debt-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  debt-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node packages/conventions/src/bin/debt-check.ts
        continue-on-error: true
  debt-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    concurrency:
      group: debt-live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node packages/conventions/src/bin/debt-check.ts --live --comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
