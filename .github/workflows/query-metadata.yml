name: query-metadata
# 旧检出、网页、直接 gh 的补漏；分类不明确时报错，github:audit 持续对账。
# GITHUB_TOKEN 的写入不再触发 Actions；同时不监听 labeled/unlabeled，避免自触发循环。
on:
  issues:
    types: [opened, edited, reopened]
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
permissions:
  contents: read
  issues: write
  pull-requests: write
concurrency:
  group: query-metadata-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node packages/conventions/src/bin/query-metadata.ts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
