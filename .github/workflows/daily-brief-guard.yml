name: daily-brief-guard
# 每日简报的独立看守（决定 0096；创始人规矩：只为要他拍的事即时打扰他，其余每天早上看一条简报）。
# 法国引擎每天 08:30（北京时间）用机器人账号在置顶进度单 #1055 发一条「【每日简报】<北京日期>」（packages/engine/src/jobs/daily-brief.ts
# 的 briefTitle）；这里 08:45 只查今天那条在不在，不在就用 Actions 自己的账号在 #1055 发一条提醒——法国整个挂了（引擎、库、网都不通）
# 也提醒得到。法国还活着时，看门狗和指挥官巡检另有「今天的简报没送到」（packages/db 的 dailyBriefProblem），这里不连法国、不看飞书。
# - 只认机器人账号发的、标题一字不差的那条：手动触发的标题是「【每日简报·手动触发】」，不算今天定时那条送到了。
# - 同一天只提醒一次（看提醒里的隐藏标记），手动重跑不重发；提醒正文里不写「【每日简报】<日期>」，免得自己把自己当成简报。
# - 读不到 #1055 的评论：这一步失败、运行变红（GitHub 会给定时任务的主人发信），不当成送到了。
# - 不在 PR、主线推送上跑，不是必过检查。
on:
  schedule:
    - cron: '45 0 * * *' # 00:45 UTC = 08:45 北京时间
  workflow_dispatch:
concurrency:
  group: daily-brief-guard
  cancel-in-progress: false
permissions:
  issues: write
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 今天的每日简报到 #1055 了没有
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: '1055'
        run: |
          set -euo pipefail
          day=$(TZ=CST-8 date +%F) # 北京日期（POSIX 写法：UTC+8、不过夏令时）
          since=$(date -u -d "$day 00:00 +0800" +%FT%TZ)
          title="【每日简报】$day"
          marker="<!-- daily-brief-guard:$day -->"
          # 今天零点（北京）以后更新过的评论，逐页数：机器人发的简报几条、今天提醒过没有
          counts=$(gh api --paginate "repos/$REPO/issues/$ISSUE/comments?since=$since&per_page=100" \
            --jq "[([.[] | select(.user.type == \"Bot\" and ((.body // \"\") | contains(\"$title\")))] | length), ([.[] | select((.body // \"\") | contains(\"$marker\"))] | length)] | @tsv")
          briefs=$(printf '%s\n' "$counts" | awk -F'\t' '{s += $1} END {print s + 0}')
          reminded=$(printf '%s\n' "$counts" | awk -F'\t' '{s += $2} END {print s + 0}')
          echo "今天 $day：#$ISSUE 上机器人发的简报 $briefs 条，提醒过 $reminded 次"
          if [ "$briefs" -gt 0 ]; then
            echo "简报送到了"
            exit 0
          fi
          if [ "$reminded" -gt 0 ]; then
            echo "简报没到，今天已经提醒过，不重发"
            exit 0
          fi
          body=$(printf '%s\n' \
            "**今天（$day）08:30 的每日简报没送到 #$ISSUE**（GitHub Actions 08:45 独立查的，不经法国）。" \
            "" \
            "法国引擎每天 08:30 会在这里发一条简报、同时推飞书团队群；到现在都没有，多半是法国挂了，或引擎的定时任务 daily-brief 没跑成。" \
            "先看驾驶舱和法国：\`systemctl status fleet-engine fleet-api\`、驾驶舱「定时任务」页 daily-brief 最近一轮的原因；修好后 \`fleet-api daily-brief --as-today\` 补发今天这一条。" \
            "" \
            "运行：$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID" \
            "" \
            "$marker")
          gh api --method POST "repos/$REPO/issues/$ISSUE/comments" -f body="$body" --jq .html_url
