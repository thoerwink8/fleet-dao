name: mirasim-launcher

on:
  pull_request:
    paths:
      - 'packages/mirasim-reclaude/**'
      - 'packages/adapters/src/mirasim/wire.ts'
      - '.github/workflows/mirasim-launcher.yml'
  push:
    branches: [main]
    paths:
      - 'packages/mirasim-reclaude/**'
      - 'packages/adapters/src/mirasim/wire.ts'
      - '.github/workflows/mirasim-launcher.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirasim-launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launcher:
    name: launcher (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-amd64
          - os: macos-15-intel
            target: darwin-amd64
          - os: macos-15
            target: darwin-arm64
          - os: ubuntu-latest
            target: linux-amd64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run packages/mirasim-reclaude/
      - run: node packages/mirasim-reclaude/src/build-ci.ts
      - uses: actions/upload-artifact@v4
        with:
          name: mirasim-launcher-${{ matrix.target }}
          path: _tmp/mirasim-launcher-${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 30
