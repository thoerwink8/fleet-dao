name: pr-labels
# PR 补贴（创始人 2026-09-26：类别标签、里程碑缺了不判红，由脚本按对应 issue 自动补；design 第七节「标签和里程碑不靠人记得贴」）。
# 对应 issue 从正文「需求」栏的 #号认，没有再看标题里的 (#号)；PR 缺类别标签就照抄 issue 的，缺里程碑就照抄 issue 的，已有的不动。
# 找不到对应 issue、issue 自己也没有：job summary 里提醒，不失败。读、写 GitHub 出错：job 红，写明原因（packages/conventions/src/pr-labels.ts）。
#
# 改这里之前必须知道：
# - 用 pull_request_target 是为了拿到能写 PR 的令牌（别人仓 fork 来的 PR 在 pull_request 下只有只读令牌）。代价是这个令牌能写，
#   所以绝不检出、绝不执行 PR 的代码：下面检出的是主线（default_branch），跑的是主线上的脚本；PR 的标题、正文只当数据读，
#   不往 run: 里用 ${{ }} 拼。这个文件本身也按主线上的算，PR 改它不影响它自己那次。
# - 用 GITHUB_TOKEN 贴的标签、挂的里程碑不会再触发别的工作流（GitHub 的规定），pr.yml 不会因为这里补了就重跑。
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
concurrency:
  group: pr-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: false
permissions:
  # 只为检出主线上的脚本；PR 的代码不检出。
  contents: read
  pull-requests: write
  issues: read
jobs:
  pr-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 只用 Node 自带的，不装依赖。退出码 2 = 没补成（读、写 GitHub 出错），job 红
      - run: node packages/conventions/src/bin/pr-labels.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
