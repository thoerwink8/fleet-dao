name: pr
# 过渡：主线必过检查还是 pr-fields，换成 merge-gate（merge-gate.yml）之后删掉这份。
# 和合并闸同一套判法（packages/conventions/src/merge-gate.ts），只算这个 PR、只报不写：判红只有草稿、冲突、改到先审后合的
# 三种路径而当前头上没有通过的 second-opinion；必填栏只提醒（黄色警告）。第二意见写上后这里不会自己重跑：
# gh run rerun <这次运行的号>（merge-gate 会自己重算）。
# 判法和清单用主线上的那份（检出 base 分支来跑），PR 改了 merge-gate.ts、清单也放不松自己的门槛。
# 还剩的洞：pull_request 下工作流文件本身由 PR 决定，改这份文件就能改检查——换成 merge-gate（pull_request_target，
# 工作流和判法都从主线来）后才堵上；在那之前，改 .github/workflows 的 PR 按路径是先审后合，由第二意见看。
on:
  pull_request:
    types:
      [
        opened,
        edited,
        synchronize,
        reopened,
        ready_for_review,
        converted_to_draft,
        labeled,
        unlabeled,
        milestoned,
        demilestoned,
      ]
concurrency:
  group: pr-fields-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
  statuses: read
jobs:
  pr-fields:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 主线上的判法和清单
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 事件只用来认是哪个 PR：标签、里程碑、正文、改动文件、提交状态、plan.md、specs 都用令牌现读。
      # 只用 Node 自带的，不用装依赖。退出码 1 = 不能合，2 = 没查成，都是红
      - name: 用主线的判法查
        if: hashFiles('base/packages/conventions/src/bin/merge-gate.ts') != ''
        run: node base/packages/conventions/src/bin/merge-gate.ts --no-write
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # 只有合并闸第一次进主线的那个 PR（#74）会走到这里：主线上还没有判法，只能用 PR 里的；那个 PR 本身是先审后合
      - if: hashFiles('base/packages/conventions/src/bin/merge-gate.ts') == ''
        uses: actions/checkout@v4
        with:
          path: pr
          persist-credentials: false
      - name: 主线还没有合并闸，用这个 PR 里的查
        if: hashFiles('base/packages/conventions/src/bin/merge-gate.ts') == ''
        run: node pr/packages/conventions/src/bin/merge-gate.ts --no-write
        env:
          GITHUB_TOKEN: ${{ github.token }}
