name: reader-rate-probe-3332
run-name: reader-rate-probe-3332
on:
  workflow_dispatch:
permissions: {}
jobs:
  gate-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: thoerwink8/fleet-dao
          ref: a76f3b3108afc21b08569671dc80bfe16f6419f3
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Compare two GET responses using trusted gate reader
        shell: bash
        env:
          PROBE_READER: gate
          PROBE_CONTEXT_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const mode = process.env.PROBE_READER;
          const emit = (record) => console.log(JSON.stringify({type: 'reader-rate-probe-3332', reader: mode, ...record}));
          const integer = (value) => typeof value === 'string' && /^(0|[1-9][0-9]{0,15})$/.test(value) && Number.isSafeInteger(Number(value)) ? value : 'unknown';
          const date = (value) => typeof value === 'string' && value.length === 29 && Number.isFinite(Date.parse(value)) && new Date(value).toUTCString() === value ? value : 'unknown';
          const safeHeaders = (headers) => {
            const resource = headers.get('x-ratelimit-resource');
            const retry = headers.get('retry-after');
            const id = headers.get('x-github-request-id');
            return {
              date: date(headers.get('date')),
              'x-ratelimit-limit': integer(headers.get('x-ratelimit-limit')),
              'x-ratelimit-remaining': integer(headers.get('x-ratelimit-remaining')),
              'x-ratelimit-reset': integer(headers.get('x-ratelimit-reset')),
              'x-ratelimit-resource': ['core', 'graphql', 'search', 'code_search', 'integration_manifest'].includes(resource) ? resource : 'unknown',
              'retry-after': integer(retry) !== 'unknown' ? integer(retry) : date(retry),
              'x-github-request-id': id && /^[0-9A-Fa-f:]{1,128}$/.test(id) ? id : 'unknown',
            };
          };
          try {
            if (!['gate', 'metadata'].includes(mode)) throw new Error('config');
            const {githubToken, liveGitHub} = await import('./packages/conventions/src/github-api.ts');
            const {ghApi} = await import('./packages/conventions/src/gh-api.ts');
            const env = process.env;
            const rawApi = env.GITHUB_API_URL || 'https://api.github.com';
            const api = rawApi.replace(/\/+$/, '');
            const apiKnown = rawApi === 'https://api.github.com' || rawApi === 'https://api.github.com/';
            const context = env.PROBE_CONTEXT_TOKEN;
            const selected = mode === 'gate' ? env.GITHUB_TOKEN : githubToken(env, () => undefined);
            const source = mode === 'gate' ? (env.GITHUB_TOKEN ? 'GITHUB_TOKEN' : 'none') : env.GITHUB_TOKEN ? 'GITHUB_TOKEN' : env.GH_TOKEN ? 'GH_TOKEN' : 'none';
            emit({phase: 'identity', sourceSha: 'a76f3b3108afc21b08569671dc80bfe16f6419f3', apiOrigin: apiKnown ? 'https://api.github.com' : 'unknown', selectedSource: source,
              selectedEqualsContext: Boolean(selected && context && selected === context),
              githubTokenEqualsContext: Boolean(env.GITHUB_TOKEN && context && env.GITHUB_TOKEN === context),
              ghTokenEqualsContext: Boolean(env.GH_TOKEN && context && env.GH_TOKEN === context),
              envPresent: Object.fromEntries(['GITHUB_TOKEN', 'GH_TOKEN', 'GITHUB_API_URL', 'HTTPS_PROXY', 'HTTP_PROXY', 'ALL_PROXY', 'NO_PROXY', 'https_proxy', 'http_proxy', 'all_proxy', 'no_proxy', 'NODE_OPTIONS', 'NODE_USE_ENV_PROXY'].map(key => [key, Boolean(env[key])])),
              nodeEnvProxyEnabled: env.NODE_USE_ENV_PROXY === '1'});
            if (!apiKnown || !selected || env.GITHUB_REPOSITORY !== 'thoerwink8/fleet-dao') throw new Error('identity');
            const allowed = [api + '/rate_limit', api + '/repos/thoerwink8/fleet-dao/pulls/3332'];
            const actualFetch = globalThis.fetch.bind(globalThis);
            const outcomes = [];
            let requests = 0;
            const auditFetch = async (input, init = {}) => {
              const target = typeof input === 'string' ? input : '';
              const headers = new Headers(init.headers);
              const index = requests;
              if (index > 1 || target !== allowed[index] || (init.method || 'GET') !== 'GET' || init.body !== undefined || headers.get('authorization') !== 'Bearer ' + selected) throw new Error('request-boundary');
              requests += 1;
              const phase = index === 0 ? 'rate_limit' : 'reader_pr';
              const startedAt = new Date().toISOString();
              let response;
              try {
                response = await actualFetch(target, {...init, redirect: 'error', signal: AbortSignal.timeout(20000)});
              } catch {
                emit({phase, startedAt, observedAt: new Date().toISOString(), result: 'transport-unknown'});
                outcomes.push(false);
                throw new Error('transport');
              }
              emit({phase, startedAt, observedAt: new Date().toISOString(), status: response.status, headers: safeHeaders(response.headers)});
              outcomes.push(response.ok);
              return response;
            };
            try {
              const response = await auditFetch(allowed[0], {method: 'GET', headers: {authorization: 'Bearer ' + selected, accept: 'application/vnd.github+json', 'x-github-api-version': '2022-11-28', 'user-agent': mode === 'gate' ? 'fleet-dao-merge-gate' : 'fleet-dao-conventions'}});
              const body = await response.json();
              const resource = (name) => Object.fromEntries(['limit', 'remaining', 'reset', 'used'].map(key => [key, Number.isSafeInteger(body?.resources?.[name]?.[key]) && body.resources[name][key] >= 0 ? body.resources[name][key] : 'unknown']));
              emit({phase: 'rate_resources', core: resource('core'), graphql: resource('graphql')});
            } catch {
              emit({phase: 'rate_resources', result: 'unavailable'});
            }
            if (requests !== 1) throw new Error('request-count');
            try {
              if (mode === 'gate') await ghApi(env, auditFetch).get('/pulls/3332');
              else await liveGitHub('thoerwink8/fleet-dao', env, {fetchImpl: auditFetch, token: () => undefined}).pull(3332);
              emit({phase: 'reader_result', result: 'read-success'});
            } catch {
              emit({phase: 'reader_result', result: 'read-failed'});
            }
            emit({phase: 'completed', requests, allHttpSuccess: requests === 2 && outcomes.length === 2 && outcomes.every(Boolean)});
            if (requests !== 2 || outcomes.length !== 2 || !outcomes.every(Boolean)) process.exitCode = 1;
          } catch {
            emit({phase: 'aborted', result: 'identity-or-config-unknown'});
            process.exitCode = 1;
          }
          NODE
