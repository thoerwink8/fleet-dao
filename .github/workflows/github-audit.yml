name: rate-limit-probe-3329
run-name: rate-limit-probe-3329
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rate-limit-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Read current repository GITHUB_TOKEN rate limit once
        env:
          PROBE_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          try {
            const response = await fetch('https://api.github.com/rate_limit', {
              method: 'GET',
              redirect: 'error',
              signal: AbortSignal.timeout(15000),
              headers: {
                Authorization: `Bearer ${process.env.PROBE_TOKEN}`,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28',
              },
            });
            const headers = Object.fromEntries([
              'date', 'x-ratelimit-limit', 'x-ratelimit-remaining', 'x-ratelimit-reset',
              'x-ratelimit-resource', 'retry-after',
            ].map((key) => [key, response.headers.get(key)]));
            console.log(JSON.stringify({ type: 'github-token-rate-limit-headers', status: response.status, headers }));
            const body = await response.json();
            const resource = (name) => {
              const value = body?.resources?.[name];
              return value && typeof value === 'object'
                ? Object.fromEntries(['limit', 'remaining', 'reset', 'used'].map((key) => [
                    key, Number.isSafeInteger(value[key]) ? value[key] : null,
                  ]))
                : null;
            };
            console.log(JSON.stringify({ type: 'github-token-rate-limit-resources', core: resource('core'), graphql: resource('graphql') }));
            if (!response.ok) process.exitCode = 1;
          } catch {
            console.log(JSON.stringify({ type: 'github-token-rate-limit-probe', result: 'transport-or-body-unknown' }));
            process.exitCode = 1;
          }
          NODE
