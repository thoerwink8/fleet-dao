name: github-audit
# GitHub 对账（#654，packages/conventions/src/github-audit.ts）：每天一轮，查 GitHub 上的单子、母子单、版本先后有没有断裂——
# 开着的单没有类别标签、母单的子单都关了它还开着、子单挂在已关的母单下面、母单标签和子单对不上、里程碑说明里的先后和实际对不上。
# 母单 manifest 含全部子单（含已关闭的），每日补齐；唯一清单自动修复正文 parent 与原生挂接，清单争抢或读取失败时不写。
# 批量母单为空、子单 parent 孤儿仍对账；目录母单允许空清单，不再因创建超过一天而报警。
# 查出来的挂得到单上的留言到那张单上（同一条只留一次），再把这一轮标红，修好才绿（红了就是这一步红；决定 0114 删了原来自动开「GitHub 对账没过」单的做法）。
# 还查一周一版的兜底：开着的 v<N> 恰好一个、带到期日、过期一天多还没收口、已关的版本还挂着开着的单、开着的 PR 挂了里程碑。
# 只在定时和手动时跑：结果随单子开关、随时间变，不进 PR 的必过检查（#87），也不在 PR、主线推送上跑；随时想核就 pnpm github:audit。
# 退出码：没有断裂 = 0；有断裂 = 1；没查成（读不到 GitHub、留言没留成）= 2。
# branches：分支体检（#769，packages/conventions/src/branch-hygiene.ts）：判远端每条分支删、留还是等人定，删内容全在主线（或已合并
# PR）里的、和巡检单上人勾了删的；有产出的列到巡检单上等人勾。只有它要删分支（contents: write），所以和上面分开一个 job；
# 内容按本地 git 比，检出全部历史。退出码：0 都判了（有等人定的也是 0）；1 有删失败的；2 没查成。随时想看就 pnpm branch:hygiene（只判不删）。
on:
  schedule:
    - cron: '41 1 * * *'
  workflow_dispatch:
concurrency:
  group: github-audit
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard inventory (advisory)
        continue-on-error: true
        run: node packages/conventions/src/bin/guard-inventory.ts --weekly-progress
        env:
          GH_TOKEN: ${{ github.token }}
      - run: node packages/conventions/src/bin/github-audit.ts --comment
        env:
          GITHUB_TOKEN: ${{ github.token }}

  version-cut:
    # 版本收口（#2683，packages/conventions/src/version-cut.ts）：一周一版，北京时间过了到期日就开下一版、把开着的单滚过去、关旧版；
    # 没到期什么都不做；已关的版本还挂着开着的单也挪到当前版本。退出码 0 收完或没到期；1 要人看；2 没做成（旧版没关）。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node packages/conventions/src/bin/version-cut.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}

  branches:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node packages/conventions/src/bin/branch-hygiene.ts --delete --board
        env:
          GITHUB_TOKEN: ${{ github.token }}
